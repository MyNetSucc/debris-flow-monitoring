      <div class="sheet-note hidden" id="ack-note"></div>

      <label class="sheet-label" for="ack-by">處理人員</label>
      <input class="search" id="ack-by" type="text" placeholder="你的名字" maxlength="60" autocomplete="name">

      <div class="sheet-label">處置原因（必選）</div>
      <div class="reasons" id="ack-reasons"></div>
      <textarea class="search hidden" id="ack-text" rows="2" maxlength="500" placeholder="請說明…"></textarea>

      <div class="sheet-err hidden" id="ack-err"></div>
      <div class="sheet-actions">
        <button class="act" id="ack-cancel">取消</button>
        <button class="act primary" id="ack-ok">送出</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    /* ==========================================================
       1. Constants & configuration
       ========================================================== */
    const LABELS = ['clear_water', 'muddy_water', 'debris_flow', 'large_rock'];
    const LABEL_TW = { clear_water: '清水', muddy_water: '濁水', debris_flow: '土石流', large_rock: '大石塊' };
    const LABEL_COLOR = {
      clear_water: 'var(--c-clear)', muddy_water: 'var(--c-muddy)',
      debris_flow: 'var(--c-debris)', large_rock: 'var(--c-rock)'
    };
    const ALERT_TW = { red: '紅燈警報', yellow: '黃燈警示', green: '綠燈正常', unknown: '無資料' };
    const ALERT_ICON = { red: '▲', yellow: '◆', green: '●', unknown: '?' };
    const LINK_TW = { live: '連線中', slow: '回報變慢', nodata: '無回報', fail: '影像抓取失敗' };

    // Acknowledgement reasons. Codes must match REASON_CODES in server.py.
    // The fp_* family marks a detection the operator judged wrong; those records
    // keep the frame paths, which makes them labelled training data later.
    const REASONS = [
      { code: 'fp_noise', label: '誤判｜畫面雜訊、光影變化', fp: true },
      { code: 'fp_lens', label: '誤判｜鏡頭髒污、遮蔽、雨滴附著', fp: true },
      { code: 'unclear', label: '無法判斷｜夜間、濃霧、強降雨' },
      { code: 'verified_none', label: '已現場查證｜無土石流' },
      { code: 'verified_debris', label: '已現場查證｜確有土石流' },
      { code: 'reported', label: '已通報權責單位' },
      { code: 'dispatched', label: '已派員前往查看' },
      { code: 'other', label: '其他（請說明）', needsText: true }
    ];
    const REASON_TW = Object.fromEntries(REASONS.map(r => [r.code, r.label]));

    // A red alert is held for 24h by the detector. Within this window of its
    // redSince it is treated as happening now; after it, as a latched state.
    const LIVE_RED_MIN = 10;
    // Multiples of each camera's own median report interval. Fixed seconds go
    // stale the moment --threads or --interval changes.
    const SLOW_MULT = 6, DEAD_MULT = 20;
    const FALLBACK_SLOW_SEC = 90, FALLBACK_DEAD_SEC = 300;
    // Above this share of cameras silent, the detector itself is presumed down
    // and the board says so once instead of raising 63 separate faults.
    const SYSTEM_DOWN_RATIO = 0.9;

    const BASEMAPS = {
      dark: { url: 'https://{a-c}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', attr: '© OpenStreetMap © CARTO' },
      street: { url: 'https://{a-c}.basemaps.cartocdn.com/voyager/{z}/{x}/{y}{r}.png', attr: '© OpenStreetMap © CARTO' },
      sat: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr: '© Esri' }
    };

    const DEFAULTS = {
      zoom: 'md', theme: 'dark', base: 'dark',
      slowMult: SLOW_MULT, deadMult: DEAD_MULT, pollSec: 5,
      sound: false, notify: false, raw: false,
      abnormalOnly: true, tile: 15, labels: true
    };
    const LS = 'dfm.console.v1';
    const cfg = Object.assign({}, DEFAULTS, readLS(LS, {}));

    /* ==========================================================
       2. State
       ========================================================== */
    const S = {
      cams: [],                 // static camera metadata from cctv.json
      byName: new Map(),        // name -> metadata
      status: {},               // raw camera_status.json
      view: [],                 // derived per-camera view models, severity-sorted
      viewByName: new Map(),
      selected: null,
      prevAlert: new Map(),     // name -> last alert level, for transition detection
      prevLink: new Map(),
      events: [],               // event feed (server history + live transitions)
      acks: new Map(),          // name -> ack record from the server
      failures: {},             // name -> {ts, event} latest fetch failure
      systemDown: false,        // detector presumed not running
      operator: readLS(LS + '.operator', ''),
      series: new Map(),        // name -> [{t, prop, conf, alert}] from /api/metrics
      kpiFilter: null,
      lastGood: null,           // timestamp of last successful poll
      failures: 0,
      frame: { seq: [], idx: 0, playing: true },
      chartVis: Object.fromEntries(LABELS.map(l => [l, true])),
      showLabels: cfg.labels
    };
    const MAX_EVENTS = 200;

    let map, camLayer, camSource, baseLayer, pulses = new Map();
    let pollTimer = null, frameTimer = null, audioCtx = null;

    /* ==========================================================
       3. Small utilities
       ========================================================== */
    function readLS(k, fallback) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
    }
    function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
    function saveCfg() { writeLS(LS, cfg); }
    function $(sel, root) { return (root || document).querySelector(sel); }
    function el(tag, cls, txt) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (txt != null) n.textContent = txt;
      return n;
    }
    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    // The detector writes naive local time ("2026-08-16 15:26:35"); the board is
    // assumed to run in the same timezone as the detector host.
    function parseTs(s) {
      if (!s) return null;
      const d = new Date(String(s).replace(' ', 'T'));
      return isNaN(d) ? null : d;
    }
    function fmtClock(d) {
      return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
    }
    function fmtAge(sec) {
      if (sec == null) return '—';
      if (sec < 60) return Math.max(0, Math.round(sec)) + ' 秒前';
      if (sec < 3600) return Math.floor(sec / 60) + ' 分前';
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      return m ? `${h} 時 ${m} 分前` : `${h} 小時前`;
    }
    function pct(v) { return ((v || 0) * 100).toFixed(1) + '%'; }

    // Image filenames carry both the capture time and the level it was
    // graded at: "<cam>_YYYYMMDD_HHMMSS_<alert>.jpg".
    function parseImageName(url) {
      const m = decodeURIComponent(url || '').match(/_(\d{8})_(\d{6})_(green|yellow|red)/);
      if (!m) return { ts: null, alert: 'unknown', label: '—' };
      const [, d, t, a] = m;
      const label = `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)} ${t.slice(0, 2)}:${t.slice(2, 4)}:${t.slice(4, 6)}`;
      return { ts: parseTs(label), alert: a, label };
    }

    /* ==========================================================
       3b. Demo mode
       Serves the public showcase from static files, so the page works on
       GitHub Pages with no backend at all. Everything it shows is invented:
       fictional stations, fictional districts, synthetic frames. Real places
       are never depicted as having a debris flow on a page anyone can reach.
       ========================================================== */
    const DEMO = new URLSearchParams(location.search).get('demo') === '1';
    let demoData = null;

    function demoImg(level, raw) {
      return `../saved_images/demo/demo_${level}${raw ? '_raw' : ''}.jpg`;
    }

    // Offsets, not absolute times: a frozen snapshot would read as a board that
    // stopped updating months ago, which is its own kind of misleading.
    function demoStamp(offsetSec) {
      const d = new Date(Date.now() + offsetSec * 1000);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function buildDemoStatus() {
      const status = {}, failures = {};
      for (const [name, s] of Object.entries(demoData.status)) {
        const lvl = s.level || 'green';
        // Three frames so the viewer's timeline has something to scrub.
        // The fragment carries the capture time and level in the same shape the
        // real filenames use, so the viewer's timeline parses it unchanged.
        const hist = [-24, -12, 0].map(off => {
          const t = demoStamp((s.tsOffsetSec || 0) + off).replace(/[-: ]/g, '');
          return `${demoImg(lvl)}#_${t.slice(0, 8)}_${t.slice(8, 14)}_${lvl}`;
        });
        status[name] = {
          alert: s.alert,
          timestamp: demoStamp(s.tsOffsetSec || 0),
          reportInterval: s.reportInterval || 0,
          redSince: s.redSinceOffsetSec != null ? demoStamp(s.redSinceOffsetSec) : null,
          redHoldUntil: s.redHoldUntilOffsetSec != null ? demoStamp(s.redHoldUntilOffsetSec) : null,
          imageUrl: hist[hist.length - 1],
          rawUrl: demoImg(lvl, true),
          history: hist,
          historyRaw: hist.map(() => demoImg(lvl, true)),
          proportion: s.proportion || {},
          confidence: s.confidence || {},
          overlap_muddy_clear: !!s.overlap_muddy_clear,
          yellowReason: s.yellowReason || '',
          redReason: s.redReason || ''
        };
        if (s.failOffsetSec != null) {
          failures[name] = {
            ts: new Date(Date.now() + s.failOffsetSec * 1000).toISOString(),
            event: s.failEvent || 'download_fail'
          };
        }
      }
      return { status, failures };
    }

    // Deterministic per-camera history so the trend chart has a shape without
    // shipping a metrics file for every demo station.
    function demoSeries(name) {
      const s = demoData.status[name];
      if (!s) return [];
      let seed = 0;
      for (const ch of name) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
      const rnd = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
      const pts = [], n = 180, step = 30000;
      const start = Date.now() - n * step;
      for (let i = 0; i < n; i++) {
        const near = i / n;                       // ramp toward the current state
        const p = s.proportion || {};
        pts.push({
          t: start + i * step,
          alert: near > 0.93 ? s.alert : (near > 0.75 && s.alert === 'red' ? 'yellow' : 'green'),
          prop: {
            clear_water: Math.max(0, (p.clear_water || 0.1) * (0.6 + rnd() * 0.7)),
            muddy_water: (p.muddy_water || 0) * near * (0.5 + rnd()),
            debris_flow: (p.debris_flow || 0) * Math.pow(near, 6) * (0.7 + rnd() * 0.6),
            large_rock: (p.large_rock || 0) * Math.pow(near, 4) * (0.7 + rnd() * 0.6)
          },
          conf: s.confidence || {}
        });
      }
      return pts;
    }

    function showDemoBanner() {
      const b = el('div', 'demo-banner');
      b.append(
        el('strong', null, '展示資料 · 非即時監測'),
        el('span', null, '本頁測站名稱、位置與影像皆為虛構，僅供介面展示，不代表任何真實地點的狀況。')
      );
      document.body.insertBefore(b, document.body.firstChild);
    }

    /* ==========================================================
       4. Data layer
       ========================================================== */
    async function fetchJSON(paths) {
      let lastErr;
      for (const p of paths) {
        try {
          const r = await fetch(p + (p.includes('?') ? '&' : '?') + '_t=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return await r.json();
        } catch (e) { lastErr = e; }
      }
      throw lastErr;
    }

    async function loadCameras() {
      if (DEMO) {
        demoData = await fetchJSON(['./demo/demo-data.json', 'demo/demo-data.json']);
        demoData.cameras.forEach(c => S.byName.set(c.name, {
          name: c.name, county: c.county, district: c.district,
          place: c.place, src: '', lon: c.lon, lat: c.lat
        }));
        return;
      }
      // Served at /web_gis/console.html with data at the root; the relative
      // fallback keeps the page usable behind a different mount point.
      S.cams = await fetchJSON(['/cctv.json', '../cctv.json', 'cctv.json']);
      S.cams.forEach(c => {
        const m = {
          name: c['攝影機名稱'],
          county: c['縣市'] || '',
          district: c['行政區'] || '',
          place: c['架設或拍攝地點'] || '',
          src: c['影像連結網址'] || '',
          lon: parseFloat(c['經度']),
          lat: parseFloat(c['緯度'])
        };
        S.byName.set(m.name, m);
      });
    }

    async function poll() {
      if (DEMO) {
        // No backend at all: recompute from offsets so the board keeps reading
        // as live, and never touch /api/*.
        const d = buildDemoStatus();
        S.status = d.status;
        S.failures = d.failures;
        S.pollFails = 0;
        S.lastGood = new Date();
        if (!serverEventsLoaded) {
          mergeServerEvents(demoData.events.map(e => ({
            ts: new Date(Date.now() + e.offsetSec * 1000).toISOString(),
            camera: e.camera, prev: e.prev, curr: e.curr,
            yellowReason: e.yellowReason, redReason: e.redReason
          })));
        }
        derive();
        renderAll();
        return;
      }
      try {
        S.status = await fetchJSON(['/camera_status.json', '/api/status', '../camera_status.json']);
        S.pollFails = 0;
        S.lastGood = new Date();
      } catch (e) {
        S.pollFails = (S.pollFails || 0) + 1;
        console.warn('poll failed', e);
      }

      // Failure events and acknowledgements come from the server, so every
      // viewer sees the same handled/unhandled picture. Neither is fatal: the
      // board still works from camera_status.json alone if they fail.
      try {
        const ev = await fetchJSON(['/api/events?limit=200']);
        S.failures = ev.failures || {};
        mergeServerEvents(ev.events || []);
      } catch (e) { /* history unavailable; live transitions still work */ }

      try {
        const a = await fetchJSON(['/api/acks']);
        S.acks = new Map(Object.entries(a.acks || {}));
      } catch (e) { /* keep the previous ack view */ }

      derive();
      renderAll();
    }

    // Server-side alert_change history is authoritative for anything that
    // happened before this page was opened; live transitions fill in from there.
    let serverEventsLoaded = false;
    function mergeServerEvents(list) {
      if (serverEventsLoaded || !list.length) return;
      serverEventsLoaded = true;
      const seeded = list.map(e => ({
        ts: new Date(e.ts),
        cam: e.camera,
        level: e.curr === 'red' ? 'red' : e.curr === 'yellow' ? 'yellow' : 'green',
        msg: `${ALERT_TW[e.prev] || e.prev} → ${ALERT_TW[e.curr] || e.curr}` +
          ((e.redReason || e.yellowReason) ? `｜${e.redReason || e.yellowReason}` : ''),
        kind: 'alert', historic: true
      })).filter(e => !isNaN(e.ts));
      S.events = seeded.concat(S.events).slice(0, MAX_EVENTS);
      feedRendered = -1;
    }

    // Turns raw status + metadata into one view model per camera, and folds
    // in the two things the raw feed does not say: how old the reading is,
    // and whether an operator has already acknowledged it.
    function derive() {
      const now = Date.now();
      const out = [];
      let silent = 0;

      for (const [name, m] of S.byName) {
        const s = S.status[name] || null;
        const ts = s ? parseTs(s.timestamp) : null;
        const ageSec = ts ? (now - ts.getTime()) / 1000 : null;

        // --- Health, from two independent signals -----------------------
        // 1. The detector says this camera's image fetch failed. That is a
        //    fault in one station's feed, and it names itself.
        // 2. Nothing has been written for this camera for a long time. That
        //    also catches the case the detector cannot report: itself dying.
        const fail = S.failures[name];
        const failTs = fail ? new Date(fail.ts) : null;
        const feedFailing = !!(failTs && !isNaN(failTs) && (!ts || failTs > ts));

        const beat = (s && +s.reportInterval) || 0;
        const slowSec = beat ? beat * (cfg.slowMult || SLOW_MULT) : FALLBACK_SLOW_SEC;
        const deadSec = beat ? beat * (cfg.deadMult || DEAD_MULT) : FALLBACK_DEAD_SEC;

        let link = 'live';
        if (!s || !ts) link = 'nodata';
        else if (ageSec > Math.max(deadSec, 60)) link = 'nodata';
        else if (ageSec > Math.max(slowSec, 30)) link = 'slow';
        if (link === 'nodata') silent++;
        if (feedFailing && link === 'live') link = 'fail';

        const alert = (s && s.alert) || 'unknown';
        const reason = s ? (s.redReason || s.yellowReason || '') : '';

        // --- Red alert timeline -----------------------------------------
        // timestamp refreshes every cycle even while the 24h hold is latched,
        // so on its own it cannot tell a debris flow happening now from one
        // that happened this morning. redSince can.
        const redSince = alert === 'red' && s ? parseTs(s.redSince) : null;
        const holdUntil = s ? parseTs(s.redHoldUntil) : null;
        const redAgeSec = redSince ? (now - redSince.getTime()) / 1000 : null;
        const redLive = alert === 'red' && (redAgeSec == null || redAgeSec <= LIVE_RED_MIN * 60);

        // --- Acknowledgement, scoped to this specific alert episode ------
        const eventKey = alert === 'red'
          ? (s && s.redSince) || 'red'
          : alert;
        const ackRec = S.acks.get(name);
        const ackValid = !!(ackRec && ackRec.eventKey === eventKey);
        const acked = ackValid && ackRec.action === 'ack';
        const cleared = ackValid && ackRec.action === 'clear_red';

        let rank;
        if (alert === 'red' && !cleared) rank = redLive ? 0 : 1;
        else if (link === 'nodata' || link === 'fail') rank = 2;
        else if (alert === 'yellow') rank = 3;
        else if (link === 'slow') rank = 4;
        else rank = 5;

        const vm = {
          name, meta: m, raw: s, alert, link, ts, ageSec, reason, rank,
          images: buildSequence(s),
          prop: (s && s.proportion) || {},
          conf: (s && s.confidence) || {},
          overlap: !!(s && s.overlap_muddy_clear),
          beat, redSince, holdUntil, redAgeSec, redLive,
          eventKey, ackRec: ackValid ? ackRec : null, acked, cleared,
          feedFailing,
          abnormal: rank <= 4
        };
        out.push(vm);
      }

      // If nearly everything went quiet at once, the detector is down — say it
      // once. Reporting 63 separate faults for one cause trains people to
      // ignore the fault list entirely.
      S.systemDown = out.length > 0 && silent / out.length >= SYSTEM_DOWN_RATIO;

      out.sort((a, b) => a.rank - b.rank || (b.ageSec == null ? 1 : a.ageSec - b.ageSec) || a.name.localeCompare(b.name, 'zh-Hant'));
      S.view = out;
      S.viewByName = new Map(out.map(v => [v.name, v]));
      detectTransitions(out);
    }

    // history/historyRaw are parallel arrays; when they are not, the raw
    // twin is derivable from the annotated name ("..._green.jpg" ->
    // "..._green_raw.jpg"), so a mismatch never blanks the viewer.
    function buildSequence(s) {
      if (!s) return [];
      const ann = [...(Array.isArray(s.history) ? s.history : [])];
      if (s.imageUrl && !ann.includes(s.imageUrl)) ann.push(s.imageUrl);
      const raws = [...(Array.isArray(s.historyRaw) ? s.historyRaw : [])];
      if (s.rawUrl && !raws.includes(s.rawUrl)) raws.push(s.rawUrl);

      const uniq = [...new Set(ann.filter(Boolean))];
      return uniq.map((u, i) => {
        const info = parseImageName(u);
        const raw = (raws.length === uniq.length && raws[i]) ? raws[i] : u.replace(/\.jpg$/i, '_raw.jpg');
        return { annotated: u, raw, ts: info.ts, label: info.label, alert: info.alert };
      }).sort((a, b) => (a.ts && b.ts) ? a.ts - b.ts : 0);
    }

    // Real history, from the CSV the detector has been writing all along.
    // Accumulating in the browser instead meant the trend chart reset on every
    // refresh and could never show anything that happened before the page
    // was opened — which is exactly when the interesting things happen.
    const seriesPending = new Set();
    async function loadSeries(name, force) {
      if (DEMO) {
        S.series.set(name, demoSeries(name));
        if (S.selected === name) {
          const vm = S.viewByName.get(name);
          if (vm) drawChart(vm);
        }
        return;
      }
      if (seriesPending.has(name)) return;
      if (!force && S.series.has(name)) return;
      seriesPending.add(name);
      try {
        const d = await fetchJSON(['/api/metrics/' + encodeURIComponent(name) + '?hours=24']);
        S.series.set(name, (d.points || []).map(p => ({
          t: parseTs(p.t) ? parseTs(p.t).getTime() : 0,
          prop: p.prop || {}, conf: p.conf || {}, alert: p.alert
        })).filter(p => p.t));
        if (S.selected === name) {
          const vm = S.viewByName.get(name);
          if (vm) drawChart(vm);
        }
      } catch (e) {
        S.series.set(name, []);   // remember the miss so it is not retried every poll
      } finally {
        seriesPending.delete(name);
      }
    }

    /* ==========================================================
       5. Event derivation, sound, notifications
       ========================================================== */
    const SEV = { green: 0, unknown: 0, yellow: 1, red: 2 };

    function detectTransitions(view) {
      const first = S.prevAlert.size === 0;
      let escalations = [];

      for (const vm of view) {
        const pa = S.prevAlert.get(vm.name);
        const pl = S.prevLink.get(vm.name);

        if (!first && pa && pa !== vm.alert) {
          const up = (SEV[vm.alert] || 0) > (SEV[pa] || 0);
          addEvent({
            ts: new Date(), cam: vm.name, level: vm.alert,
            msg: `${ALERT_TW[pa] || pa} → ${ALERT_TW[vm.alert] || vm.alert}` +
              (vm.reason ? `｜${vm.reason}` : ''),
            kind: 'alert'
          });
          // A fresh escalation carries a new eventKey, so any previous
          // acknowledgement stops applying on its own — nothing to clear.
          if (up && (vm.alert === 'red' || vm.alert === 'yellow')) escalations.push(vm);
        }

        // Suppressed while the detector is down: that is one fault, already
        // reported once, not sixty-three separate feed outages.
        if (!first && !S.systemDown && pl && pl !== vm.link && (pl === 'live' || vm.link === 'live')) {
          addEvent({
            ts: new Date(), cam: vm.name, level: vm.link === 'live' ? 'green' : 'gray',
            msg: vm.link === 'live' ? '影像回報恢復' : `影像中斷（${LINK_TW[vm.link]}）`,
            kind: 'link'
          });
        }

        S.prevAlert.set(vm.name, vm.alert);
        S.prevLink.set(vm.name, vm.link);
      }

      if (escalations.length) {
        const worst = escalations.some(v => v.alert === 'red') ? 'red' : 'yellow';
        alarm(worst);
        escalations.slice(0, 4).forEach(v => toast(v));
        notify(escalations, worst);
      }
    }

    function addEvent(ev) {
      S.events.unshift(ev);
      if (S.events.length > MAX_EVENTS) S.events.length = MAX_EVENTS;
    }

    // Synthesised so the board needs no audio asset and works offline.
    function alarm(level) {
      if (!cfg.sound) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const beeps = level === 'red' ? [[880, 0], [880, .22], [1174, .44]] : [[660, 0]];
        for (const [freq, at] of beeps) {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'sine'; o.frequency.value = freq;
          const t0 = audioCtx.currentTime + at;
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(.28, t0 + .02);
          g.gain.exponentialRampToValueAtTime(.001, t0 + .18);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t0); o.stop(t0 + .2);
        }
      } catch (e) { console.warn('alarm', e); }
    }

    function toast(vm) {
      const box = el('div', 'toast lv-' + vm.alert);
      const h = el('div', 't-head');
      h.append(el('span', null, ALERT_ICON[vm.alert]), el('span', null, ALERT_TW[vm.alert]));
      const b = el('div', 't-body', `${vm.name}｜${vm.meta.county}${vm.meta.district}` + (vm.reason ? `\n${vm.reason}` : ''));
      box.append(h, b);
      box.onclick = () => { select(vm.name); box.remove(); };
      $('#toasts').appendChild(box);
      setTimeout(() => box.remove(), 15000);
    }

    function notify(list, worst) {
      if (!cfg.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
      const title = worst === 'red' ? `🔴 土石流警報 ×${list.length}` : `🟡 黃燈警示 ×${list.length}`;
      try { new Notification(title, { body: list.slice(0, 5).map(v => v.name).join('、'), tag: 'dfm-alert' }); } catch (e) { }
    }

    /* ==========================================================
       6. Map
       ========================================================== */
    function initMap() {
      baseLayer = new ol.layer.Tile({
        source: new ol.source.XYZ({ url: BASEMAPS[cfg.base].url, attributions: BASEMAPS[cfg.base].attr })
      });
      camSource = new ol.source.Vector();
      camLayer = new ol.layer.Vector({ source: camSource });

      map = new ol.Map({
        target: 'map',
        layers: [baseLayer, camLayer],
        view: new ol.View({ center: ol.proj.fromLonLat([120.9, 23.7]), zoom: 7.4 }),
        controls: ol.control.defaults.defaults({ rotate: false })
      });

      for (const [name, m] of S.byName) {
        if (isNaN(m.lon) || isNaN(m.lat)) continue;
        const f = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([m.lon, m.lat])), camName: name });
        f.setStyle(markerStyle('unknown', 'nodata', false, name));
        camSource.addFeature(f);
        m.feature = f;
      }

      map.on('click', e => {
        const f = map.forEachFeatureAtPixel(e.pixel, x => x, { hitTolerance: 6 });
        if (f) select(f.get('camName'));
      });
      map.on('pointermove', e => {
        const hit = map.hasFeatureAtPixel(e.pixel, { hitTolerance: 6 });
        map.getTargetElement().style.cursor = hit ? 'pointer' : '';
      });

      // The container can still measure 0 when the map is constructed (fonts
      // settling, a restored wall layout, a background tab). Re-measure on the
      // next frame so the view is never stuck at zero size.
      requestAnimationFrame(() => { map.updateSize(); fitAll(); });
      fitAll();
    }

    const styleCache = new Map();
    function markerStyle(alert, link, selected, name) {
      const showLabel = S.showLabels && (alert === 'red' || alert === 'yellow' || link === 'nodata' || link === 'fail' || selected);
      const key = [alert, link, selected, showLabel ? name : ''].join('|');
      if (styleCache.has(key)) return styleCache.get(key);

      const colors = { red: '#ff4d4f', yellow: '#fbbf24', green: '#22c55e', unknown: '#7c8aa0' };
      const dead = link === 'nodata' || link === 'fail';
      const fill = dead ? '#7c8aa0' : (colors[alert] || colors.unknown);
      const r = alert === 'red' ? 11 : alert === 'yellow' ? 9 : dead ? 8 : 6;

      // z-order is fully determined by the cache key, so sharing one Style
      // object between identical markers stays correct.
      const z = selected ? 500 : alert === 'red' ? 400 : alert === 'yellow' ? 300 : dead ? 200 : 100;

      const st = new ol.style.Style({
        zIndex: z,
        image: new ol.style.Circle({
          radius: r,
          fill: new ol.style.Fill({ color: fill }),
          stroke: new ol.style.Stroke({
            color: selected ? '#38bdf8' : 'rgba(255,255,255,.85)',
            width: selected ? 4 : (dead ? 1.5 : 2),
            lineDash: dead ? [3, 3] : undefined
          })
        }),
        text: showLabel ? new ol.style.Text({
          text: name.length > 9 ? name.slice(0, 9) + '…' : name,
          offsetY: -(r + 10),
          font: '700 12px "Noto Sans TC", sans-serif',
          fill: new ol.style.Fill({ color: cfg.theme === 'dark' ? '#f8fafc' : '#0f172a' }),
          stroke: new ol.style.Stroke({ color: cfg.theme === 'dark' ? 'rgba(0,0,0,.85)' : 'rgba(255,255,255,.9)', width: 3 })
        }) : undefined
      });
      styleCache.set(key, st);
      return st;
    }

    function updateMap() {
      for (const vm of S.view) {
        const f = vm.meta.feature;
        if (!f) continue;
        f.setStyle(markerStyle(vm.alert, vm.link, S.selected === vm.name, vm.name));
      }
      syncPulses();
    }

    function syncPulses() {
      // Only a live, unhandled red pulses. A latched red from this morning
      // that keeps flashing all day is how a warning stops being a warning.
      const want = new Set(S.view
        .filter(v => v.alert === 'red' && v.redLive && !v.acked && !v.cleared && v.meta.feature)
        .map(v => v.name));
      for (const [name, ov] of pulses) {
        if (!want.has(name)) { map.removeOverlay(ov); pulses.delete(name); }
      }
      for (const name of want) {
        if (pulses.has(name)) continue;
        const m = S.byName.get(name);
        const ov = new ol.Overlay({
          element: el('div', 'pulse'),
          position: ol.proj.fromLonLat([m.lon, m.lat]),
          stopEvent: false
        });
        map.addOverlay(ov);
        pulses.set(name, ov);
      }
    }

    function fitAll() {
      const ext = camSource.getExtent();
      if (ext && !ol.extent.isEmpty(ext)) map.getView().fit(ext, { padding: [60, 60, 60, 60], duration: 600, maxZoom: 12 });
    }

    function flyTo(name, zoom) {
      const m = S.byName.get(name);
      if (!m || isNaN(m.lon)) return;
      map.getView().animate({ center: ol.proj.fromLonLat([m.lon, m.lat]), zoom: zoom || 13, duration: 700 });
    }

    /* ==========================================================
       7. Rendering — KPIs, queue, feed, wall
       ========================================================== */
    function renderAll() {
      renderKpis();
      renderQueue();
      renderFeed();
      renderDetail();
      renderWall();
      updateMap();
      renderConn();
    }

    function renderKpis() {
      // A camera that stopped reporting is not "normal", whatever its last
      // light said — it is counted as a fault so a dead feed can never sit
      // quietly inside the green total.
      const c = { red: 0, held: 0, yellow: 0, fault: 0, green: 0 };
      for (const v of S.view) {
        if (v.alert === 'red' && !v.cleared) { c.red++; if (!v.redLive) c.held++; }
        else if (v.link === 'nodata' || v.link === 'fail') c.fault++;
        else if (v.alert === 'yellow') c.yellow++;
        else c.green++;
      }
      $('#kpi-red').textContent = c.red;
      $('#kpi-yellow').textContent = c.yellow;
      $('#kpi-offline').textContent = c.fault;
      $('#kpi-green').textContent = c.green;

      // "紅燈 7（鎖定 5）" — the held ones are still a warning state, but they
      // are not five debris flows happening right now.
      const sub = $('#kpi-red-sub');
      if (sub) {
        sub.textContent = c.held ? `鎖定 ${c.held}` : '';
        sub.classList.toggle('hidden', !c.held);
      }

      // Only an unacknowledged, currently-live red makes the counter pulse.
      const redPill = document.querySelector('.kpi.red');
      redPill.dataset.hot = S.view.some(v => v.alert === 'red' && v.redLive && !v.acked && !v.cleared) ? '1' : '0';
      // The demo marker has to survive every re-render: the tab title is what
      // a bookmark and a shared-link preview show.
      document.title = (DEMO ? '【展示版】' : '')
        + (c.red ? `🔴 ${c.red} ` : c.yellow ? `🟡 ${c.yellow} ` : '')
        + '土石流監測值班台';
    }

    function renderConn() {
      const conn = $('#conn'), txt = $('#conn-txt');
      const fails = S.pollFails || 0;
      const bad = fails > 0 || S.systemDown;
      conn.className = 'conn ' + (bad ? 'bad' : 'ok');
      txt.textContent = fails ? `連線中斷（重試 ${fails}）`
        : S.systemDown ? '偵測程式未運行' : '連線正常';

      const ages = S.view.map(v => v.ageSec).filter(a => a != null);
      const freshest = ages.length ? Math.min(...ages) : null;
      $('#data-age').textContent = freshest == null ? '尚無影像資料' : '最新影像 ' + fmtAge(freshest);

      // Two different failures, two different messages. "Cannot reach the
      // server" is the viewer's problem; "the detector is not running" is the
      // system's, and only the second one means nothing is being watched.
      let banner = $('#offline-banner');
      const msg = fails >= 3 ? '⚠ 無法連線到監測伺服器，畫面資料可能已過期'
        : S.systemDown ? `⚠ 全部測站停止回報 — 偵測程式可能未運行（最新影像 ${freshest == null ? '無' : fmtAge(freshest)}）`
          : null;
      if (msg) {
        if (!banner) {
          banner = el('div', 'banner');
          banner.id = 'offline-banner';
          document.body.appendChild(banner);
        }
        if (banner.textContent !== msg) banner.textContent = msg;
      } else if (banner) banner.remove();
    }

    function passesFilter(vm, q) {
      const faulty = vm.link === 'nodata' || vm.link === 'fail';
      if (S.kpiFilter) {
        if (S.kpiFilter === 'red' && !(vm.alert === 'red' && !vm.cleared)) return false;
        if (S.kpiFilter === 'offline' && !(!(vm.alert === 'red' && !vm.cleared) && faulty)) return false;
        if (S.kpiFilter === 'yellow' && !(vm.alert === 'yellow' && !faulty)) return false;
        if (S.kpiFilter === 'green' && !(vm.alert === 'green' && vm.link === 'live')) return false;
      }
      if (q) {
        const hay = (vm.name + ' ' + vm.meta.county + ' ' + vm.meta.district + ' ' + vm.meta.place).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }

    // Section membership mirrors the KPI counters exactly, so a number in the
    // header always leads to the same set of rows when clicked.
    const isRed = v => v.alert === 'red' && !v.cleared;
    const isFaulty = v => v.link === 'nodata' || v.link === 'fail';
    const SECTIONS = [
      { id: 'red', title: '🔴 紅燈警報', cls: 's-red', test: v => isRed(v) && v.redLive },
      { id: 'redheld', title: '🔴 紅燈鎖定中', cls: 's-red', test: v => isRed(v) && !v.redLive },
      { id: 'offline', title: '⚫ 測站異常', cls: 's-offline', test: v => !isRed(v) && isFaulty(v) },
      { id: 'yellow', title: '🟡 黃燈警示', cls: 's-yellow', test: v => !isRed(v) && !isFaulty(v) && v.alert === 'yellow' },
      { id: 'green', title: '🟢 正常回報', cls: 's-green', test: v => !isRed(v) && !isFaulty(v) && v.alert !== 'yellow' }
    ];
    const collapsed = new Set(readLS(LS + '.collapsed', ['green']));
    const rowCache = new Map();

    function renderQueue() {
      const q = $('#q-search').value.trim().toLowerCase();
      const list = S.view.filter(v => passesFilter(v, q));
      const box = $('#queue');
      box.textContent = '';

      let shown = 0;
      for (const sec of SECTIONS) {
        let items = list.filter(sec.test);
        // "異常優先" keeps the green section as a one-line summary so 60
        // healthy stations cannot bury the two that need attention.
        const summarise = cfg.abnormalOnly && sec.id === 'green' && !q && !S.kpiFilter;
        // A search is an explicit request to see matches, so it overrides
        // whatever the operator had folded away. A non-empty red section is
        // never folded at all: a fold set some other day must not be able to
        // hide today's debris flow behind a collapsed header.
        const forced = sec.cls === 's-red' && items.length > 0;
        const isShut = !forced && !q && (collapsed.has(sec.id) || summarise);
        if (!items.length) continue;

        const head = el('div', 'sec-head ' + sec.cls);
        head.append(el('span', 'caret', '▾'), el('span', null, sec.title), el('span', 'n', items.length));
        if (isShut) head.classList.add('collapsed');
        head.onclick = () => {
          if (forced) return;      // red stays open while it has anything in it
          if (summarise) {
            // Expanding the summarised green section is the same intent as
            // turning "異常優先" off; do that instead of fighting it.
            cfg.abnormalOnly = false;
            collapsed.delete(sec.id);
            saveCfg();
            syncControls();
          } else if (collapsed.has(sec.id)) {
            collapsed.delete(sec.id);
          } else {
            collapsed.add(sec.id);
          }
          writeLS(LS + '.collapsed', [...collapsed]);
          renderQueue();
        };
        box.appendChild(head);

        if (isShut) continue;
        for (const vm of items) { box.appendChild(queueRow(vm)); shown++; }
      }

      if (!shown && !list.length) {
        const e = el('div', 'empty');
        e.append(el('span', 'big', '✅'), document.createTextNode(q ? '沒有符合搜尋條件的攝影機' : '目前沒有需要注意的站點'));
        box.appendChild(e);
      }
      $('#q-count').textContent = list.length + ' / ' + S.view.length;

      // Bottom-tab badge: how many stations need a person to look at them.
      const badge = $('#mt-badge');
      if (badge) {
        const n = S.view.filter(v => v.abnormal).length;
        badge.textContent = n > 99 ? '99+' : n;
        badge.classList.toggle('zero', n === 0);
      }
    }

    function queueRow(vm) {
      let row = rowCache.get(vm.name);
      if (!row) {
        row = el('div', 'q-row');
        row.innerHTML =
          '<div class="q-bar"></div>' +
          '<div class="q-thumb"><div class="ph">📷</div><img alt="" loading="lazy"></div>' +
          '<div class="q-main"><div class="q-name"></div><div class="q-meta"></div><div class="q-reason"></div></div>' +
          '<div class="q-right"></div>';
        row._img = row.querySelector('img');
        row._ph = row.querySelector('.ph');
        row._name = row.querySelector('.q-name');
        row._meta = row.querySelector('.q-meta');
        row._reason = row.querySelector('.q-reason');
        row._right = row.querySelector('.q-right');
        row._name.textContent = vm.name;
        row._img.onload = () => { row._ph.style.display = 'none'; };
        row._img.onerror = () => { row._ph.style.display = ''; row._ph.textContent = '⚠'; };
        row.onclick = () => select(vm.name);
        rowCache.set(vm.name, row);
      }

      row.className = 'q-row a-' + vm.alert + (S.selected === vm.name ? ' sel' : '');
      row._meta.textContent = `${vm.meta.county}${vm.meta.district}`;
      if (vm.reason) { row._reason.textContent = '⚠ ' + vm.reason; row._reason.style.display = ''; }
      else row._reason.style.display = 'none';

      const latest = vm.images[vm.images.length - 1];
      const src = latest ? (cfg.raw ? latest.raw : latest.annotated) : '';
      if (src && row._img.getAttribute('src') !== src) row._img.src = src;
      if (!src) { row._img.removeAttribute('src'); row._ph.style.display = ''; row._ph.textContent = '📷'; }

      row._right.textContent = '';
      const b = el('span', 'badge ' + (vm.alert === 'unknown' ? 'gray' : vm.alert));
      b.append(el('span', null, ALERT_ICON[vm.alert]), el('span', null, vm.alert.toUpperCase()));
      row._right.appendChild(b);

      // A held red says when its event happened. Without that, this morning's
      // debris flow is indistinguishable from one starting right now.
      if (vm.alert === 'red' && !vm.redLive && vm.redSince) {
        row._right.appendChild(el('span', 'badge gray', '鎖定中 ' + fmtClock(vm.redSince).slice(0, 5)));
      }
      if (vm.link !== 'live') row._right.appendChild(el('span', 'badge gray', LINK_TW[vm.link]));
      if (vm.cleared) row._right.appendChild(el('span', 'badge ack', '✓ 已解除'));
      else if (vm.acked) row._right.appendChild(el('span', 'badge ack', '✓ 已確認'));

      const age = el('span', 'q-age' + (vm.link === 'nodata' || vm.link === 'fail' ? ' offline' : vm.link === 'slow' ? ' stale' : ''), fmtAge(vm.ageSec));
      row._right.appendChild(age);
      return row;
    }

    let feedRendered = -1;
    function renderFeed() {
      const body = $('#feed-body');
      $('#ev-count').textContent = S.events.length;
      // Rebuilding an unchanged feed on every poll would throw away the
      // operator's scroll position while they are reading it.
      if (!S.events.length || S.events.length === feedRendered) return;
      feedRendered = S.events.length;
      body.textContent = '';
      for (const ev of S.events) {
        const row = el('div', 'ev lv-' + (ev.level === 'red' ? 'red' : ev.level === 'yellow' ? 'yellow' : 'none'));
        row.append(
          el('span', 'ev-t', fmtClock(ev.ts)),
          el('span', 'arrow', ALERT_ICON[ev.level] || '·'),
          (() => { const c = el('span', 'ev-cam', ev.cam); return c; })(),
          el('span', 'ev-msg', ev.msg)
        );
        row.onclick = () => select(ev.cam);
        body.appendChild(row);
      }
    }

    /* ==========================================================
       8. Detail panel
       ========================================================== */
    function select(name) {
      if (!S.byName.has(name)) return;
      S.selected = name;
      S.frame.idx = -1;      // -1 => track the newest frame
      loadSeries(name, true);
      renderDetail(true);
      renderQueue();
      updateMap();
      flyTo(name, Math.max(map.getView().getZoom(), 11));
      if (!$('#wall-shell').classList.contains('hidden')) setMode('console');
      // On a phone the detail panel is a separate tab, so picking a camera
      // has to take you there or the tap appears to do nothing.
      if (isMobile()) setMobileTab('detail');
    }

    let detailBuilt = null;
    function renderDetail(force) {
      const box = $('#detail');
      const vm = S.selected ? S.viewByName.get(S.selected) : null;

      if (!vm) {
        if (detailBuilt !== null) {
          box.textContent = '';
          const e = el('div', 'empty'); e.style.marginTop = '4rem';
          e.append(el('span', 'big', '👈'), document.createTextNode('從左側佇列或地圖選擇一台攝影機'));
          box.appendChild(e);
          detailBuilt = null;
        }
        return;
      }

      if (detailBuilt !== vm.name || force) { buildDetail(box, vm); detailBuilt = vm.name; }
      updateDetail(vm);
    }

    function buildDetail(box, vm) {
      box.textContent = '';

      const head = el('div', 'd-head');
      const nm = el('div', 'd-name');
      const a = el('a', null, vm.name);
      a.href = vm.meta.src || '#'; a.target = '_blank'; a.rel = 'noopener'; a.title = '開啟原始 CCTV 站台';
      nm.appendChild(a);
      head.append(nm, el('div', 'd-loc', `${vm.meta.county}${vm.meta.district}｜${vm.meta.place}`));
      box.appendChild(head);

      const st = el('div', 'd-status');
      st.id = 'd-status';
      st.innerHTML = '<div class="s-icon"></div><div class="s-txt"><div class="s-lv"></div><div class="s-sub"></div></div>';
      box.appendChild(st);

      const frame = el('div', 'frame');
      frame.innerHTML =
        '<img id="d-img" alt="偵測影像">' +
        '<div class="f-empty hidden" id="d-empty">尚無影像</div>' +
        '<span class="badge f-lv" id="d-flv"></span>' +
        '<div class="f-stamp" id="d-stamp">—</div>' +
        '<button class="f-nav prev" id="d-prev">‹</button>' +
        '<button class="f-nav next" id="d-next">›</button>';
      box.appendChild(frame);

      const ctrl = el('div', 'f-ctrl');
      ctrl.innerHTML =

      if (vm.alert === 'red') title += vm.redLive ? '（現正發生）' : '（鎖定中）';
      if (vm.cleared) title += '・已解除';
      else if (vm.acked) title += '・已確認';
      st.querySelector('.s-lv').textContent = title;

      const sub = [];
      // For a red alert the event time matters more than the frame time.
      if (vm.alert === 'red' && vm.redSince) {
        sub.push(`事件於 ${vm.redSince.toLocaleString('zh-TW', { hour12: false })}（${fmtAge(vm.redAgeSec)}）`);
        if (vm.holdUntil) sub.push(`鎖定至 ${vm.holdUntil.toLocaleString('zh-TW', { hour12: false })}`);
      }
      sub.push(vm.link === 'live' ? `影像更新於 ${fmtAge(vm.ageSec)}` : `${LINK_TW[vm.link]}・最後回報 ${fmtAge(vm.ageSec)}`);
      if (vm.reason) sub.push(vm.reason);
      if (vm.overlap) sub.push('濁水與清水區域重疊');
      if (vm.ackRec) {
        sub.push(`${vm.ackRec.action === 'clear_red' ? '解除' : '確認'}：${vm.ackRec.by}・${REASON_TW[vm.ackRec.reason] || vm.ackRec.reason}` +
          (vm.ackRec.reasonText ? `（${vm.ackRec.reasonText}）` : ''));
      }
      st.querySelector('.s-sub').textContent = sub.join('｜');

      const ackBtn = $('#d-ack');
      if (ackBtn) {
        const handled = vm.acked || vm.cleared;
        ackBtn.textContent = handled ? '↺ 取消處置' : '✓ 確認警報';
        ackBtn.className = 'act ' + (handled ? '' : 'primary');
        ackBtn.disabled = vm.alert !== 'red' && vm.alert !== 'yellow' && !handled;
        ackBtn.style.opacity = ackBtn.disabled ? .45 : '';
      }
      const clrBtn = $('#d-clear');
      if (clrBtn) clrBtn.classList.toggle('hidden', !(vm.alert === 'red' && !vm.redLive && !vm.cleared));
      const rawBtn = $('#d-raw');
      if (rawBtn) rawBtn.textContent = cfg.raw ? '🖼 顯示標註' : '🖼 顯示原始';

      // Frame sequence
      S.frame.seq = vm.images;
      const rng = $('#d-range');
      rng.max = Math.max(0, vm.images.length - 1);
      if (S.frame.idx < 0 || S.frame.idx > vm.images.length - 1) S.frame.idx = vm.images.length - 1;

          ['最後判讀時間', vm.ts ? vm.ts.toLocaleString('zh-TW', { hour12: false }) : '—'],
          ['回報節奏', vm.beat ? `每 ${vm.beat} 秒` : '樣本不足'],
          ['連線狀態', LINK_TW[vm.link] + (vm.feedFailing ? '（偵測端回報抓取失敗）' : '')],
          ['近 24 小時樣本', String((S.series.get(vm.name) || []).length)]

    function showFrame(i) {
      const seq = S.frame.seq;
      const img = $('#d-img'), empty = $('#d-empty');
      if (!img) return;
      if (!seq.length) {
        img.removeAttribute('src');
        empty.classList.remove('hidden');
        empty.textContent = '尚無影像';
        $('#d-cnt').textContent = '0/0';
        $('#d-stamp').textContent = '—';
        $('#d-flv').textContent = '';
        return;
      }
      const n = seq.length;
      S.frame.idx = ((i % n) + n) % n;
      const f = seq[S.frame.idx];
      const src = cfg.raw ? f.raw : f.annotated;
      if (img.getAttribute('src') !== src) img.src = src;
      $('#d-range').value = S.frame.idx;
      $('#d-cnt').textContent = (S.frame.idx + 1) + '/' + n;
      $('#d-stamp').textContent = f.label + (cfg.raw ? '　原始' : '　AI 標註');
      const lv = $('#d-flv');
      lv.className = 'badge f-lv ' + (f.alert === 'unknown' ? 'gray' : f.alert);
      lv.textContent = (ALERT_ICON[f.alert] || '') + ' ' + f.alert.toUpperCase();
    }

    function stepFrame(d) { S.frame.playing = false; syncPlayBtn(); showFrame(S.frame.idx + d); }
    function syncPlayBtn() { $('#btn-play').textContent = S.frame.playing ? '⏸ 暫停' : '▶ 播放'; }

    /* ==========================================================
       8b. Acknowledgement
       ========================================================== */
    const ACK = { vm: null, action: 'ack', reason: null };

    function openAckSheet(vm, action) {
      ACK.vm = vm; ACK.action = action; ACK.reason = null;

      $('#ack-title').textContent = action === 'clear_red' ? '解除紅燈鎖定' : '確認警報';
      const cam = $('#ack-cam');
      cam.textContent = '';
      cam.append(
        el('span', 'lv', `${ALERT_ICON[vm.alert]} ${ALERT_TW[vm.alert]}`),
        document.createTextNode(`　${vm.name}　${vm.meta.county}${vm.meta.district}`)
      );

      const note = $('#ack-note');
      if (DEMO) {
        note.textContent = '展示版沒有後端，無法寫入處置紀錄。實際部署時，此處會記錄處理人員、原因與時間。';
        note.classList.remove('hidden');
        $('#ack-ok').disabled = true;
        $('#ack-ok').style.opacity = .45;
      } else if (action === 'clear_red') {
        // Say plainly what this does and does not do. An operator who thinks
        // they disarmed the detector when they did not is worse off than one
        // who was never offered the button.
        note.textContent = '解除只影響本板面的呈現：此測站會從紅燈區移出並標記為已解除。'
          + '偵測程式的 24 小時鎖定不受影響，仍會持續判定為紅燈。';
        note.classList.remove('hidden');
      } else note.classList.add('hidden');

      $('#ack-by').value = S.operator || '';
      $('#ack-text').value = '';
      $('#ack-text').classList.add('hidden');
      $('#ack-err').classList.add('hidden');

      const box = $('#ack-reasons');
      box.textContent = '';
      for (const r of REASONS) {
        const b = el('button', 'reason');
        b.append(el('span', 'rd'), el('span', null, r.label));
        b.onclick = () => {
          ACK.reason = r.code;
          [...box.children].forEach(c => c.classList.remove('sel'));
          b.classList.add('sel');
          $('#ack-text').classList.toggle('hidden', !r.needsText);
          if (r.needsText) $('#ack-text').focus();
        };
        box.appendChild(b);
      }

      $('#ack-back').classList.remove('hidden');
      setTimeout(() => $('#ack-by').focus(), 40);
    }

    function closeAckSheet() {
      $('#ack-back').classList.add('hidden');
      ACK.vm = null;
    }

    async function submitAck() {
      const vm = ACK.vm;
      if (!vm) return;
      const by = $('#ack-by').value.trim();
      const text = $('#ack-text').value.trim();
      const needsText = REASONS.find(r => r.code === ACK.reason)?.needsText;

      const err = $('#ack-err');
      const fail = msg => { err.textContent = msg; err.classList.remove('hidden'); };
      if (!by) return fail('請填寫處理人員姓名。');
      if (!ACK.reason) return fail('請選擇處置原因。');
      if (needsText && !text) return fail('選擇「其他」時必須填寫說明。');

      S.operator = by;
      writeLS(LS + '.operator', by);

      const ok = await sendAck(vm, ACK.action, ACK.reason, text);
      if (ok) closeAckSheet();
      else fail('送出失敗，請確認伺服器連線後再試。');
    }

    async function sendAck(vm, action, reason, reasonText) {
      if (DEMO) return false;   // nothing to write to; the sheet says so
      const by = S.operator || $('#ack-by')?.value?.trim() || '';
      if (!by && action === 'unack') {
        // Undo still needs a name: the record is what makes it accountable.
        openAckSheet(vm, 'ack');
        return false;
      }
      const latest = vm.images[vm.images.length - 1];
      const body = {
        action, camera: vm.name, by,
        alert: vm.alert,
        alertTs: vm.raw ? vm.raw.timestamp : '',
        eventKey: vm.eventKey,
        reason: reason || '', reasonText: reasonText || '',
        // Frames are kept for the misdetection reasons: they become labelled
        // examples for whoever next tunes the model.
        images: latest ? { annotated: latest.annotated, raw: latest.raw } : {}
      };
      try {
        const r = await fetch('/api/acks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!r.ok) { console.warn('ack rejected', await r.text()); return false; }
        const a = await fetchJSON(['/api/acks']);
        S.acks = new Map(Object.entries(a.acks || {}));
        derive(); renderAll();
        return true;
      } catch (e) {
        console.error('ack failed', e);
        return false;
      }
    }

    /* ==========================================================
       9. Trend chart (canvas)
       ========================================================== */
    function drawChart(vm) {
      const cv = $('#d-chart');
      if (!cv) return;
      const rect = cv.getBoundingClientRect();
      if (!rect.width) return;
      const dpr = window.devicePixelRatio || 1;
      cv.width = rect.width * dpr; cv.height = rect.height * dpr;
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = rect.width, H = rect.height;
      ctx.clearRect(0, 0, W, H);

      const css = getComputedStyle(document.documentElement);
      const line = css.getPropertyValue('--line-strong').trim() || 'rgba(148,163,184,.3)';
      const fg3 = css.getPropertyValue('--fg-3').trim() || '#64748b';

      const data = S.series.get(vm.name) || [];
      const PL = 30, PR = 6, PT = 8, PB = 16;
      const w = W - PL - PR, h = H - PT - PB;

      // Axes
      ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.font = '10px "JetBrains Mono", monospace'; ctx.fillStyle = fg3;
      for (let i = 0; i <= 4; i++) {
        const y = PT + h * i / 4;
        ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(PL + w, y); ctx.stroke();
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText((100 - i * 25) + '%', PL - 4, y);
      }

      if (data.length < 2) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(S.series.has(vm.name) ? '近 24 小時無可用紀錄' : '載入歷史中…', PL + w / 2, PT + h / 2);
        return;
      }

      const t0 = data[0].t, t1 = data[data.length - 1].t;
      const span = Math.max(1, t1 - t0);
      const X = t => PL + w * (t - t0) / span;
      const Y = v => PT + h * (1 - Math.min(1, Math.max(0, v)));

      // Alert bands behind the lines: where the light was not green.
      for (let i = 1; i < data.length; i++) {
        const a = data[i].alert;
        if (a !== 'red' && a !== 'yellow') continue;
        ctx.fillStyle = a === 'red' ? 'rgba(255,77,79,.16)' : 'rgba(251,191,36,.14)';
        ctx.fillRect(X(data[i - 1].t), PT, Math.max(1, X(data[i].t) - X(data[i - 1].t)), h);
      }

      // Series
      for (const l of LABELS) {
        if (!S.chartVis[l]) continue;
        ctx.strokeStyle = css.getPropertyValue(LABEL_COLOR[l].replace('var(', '').replace(')', '')).trim() || '#888';
        ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
        ctx.beginPath();
        data.forEach((d, i) => {
          const x = X(d.t), y = Y((d.prop && d.prop[l]) || 0);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
      }

      // Time axis labels
      ctx.fillStyle = fg3; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
      ctx.fillText(fmtClock(new Date(t0)).slice(0, 5), PL, PT + h + 3);
      ctx.textAlign = 'right';
      ctx.fillText(fmtClock(new Date(t1)).slice(0, 5), PL + w, PT + h + 3);
    }

    /* ==========================================================
       10. Wall view
       ========================================================== */
    const tileCache = new Map();
    function renderWall() {
      if ($('#wall-shell').classList.contains('hidden')) return;
      const q = $('#w-search').value.trim().toLowerCase();
      const grid = $('#wall');
      let list = S.view.filter(v => passesFilter(v, q));
      if (cfg.abnormalOnly) list = list.slice().sort((a, b) => a.rank - b.rank);

      grid.textContent = '';
      for (const vm of list) grid.appendChild(wallTile(vm));
      if (!list.length) {
        const e = el('div', 'empty'); e.style.gridColumn = '1 / -1';
        e.append(el('span', 'big', '🔍'), document.createTextNode('沒有符合條件的攝影機'));
        grid.appendChild(e);
      }
    }

    function wallTile(vm) {
      let t = tileCache.get(vm.name);
      if (!t) {
        t = el('div', 'tile');
        t.innerHTML =
          '<div class="tile-img"><img alt="" loading="lazy"><div class="ph">📷 無影像</div>' +
          '<span class="badge t-lv"></span><span class="t-age"></span></div>' +
          '<div class="tile-cap"><div class="tile-name"></div><div class="tile-sub"></div></div>';
        t._img = t.querySelector('img'); t._ph = t.querySelector('.ph');
        t._lv = t.querySelector('.t-lv'); t._age = t.querySelector('.t-age');
        t._nm = t.querySelector('.tile-name'); t._sub = t.querySelector('.tile-sub');
        t._nm.textContent = vm.name;
        t._img.onload = () => { t._ph.style.display = 'none'; };
        t._img.onerror = () => { t._ph.style.display = ''; };
        t.onclick = () => select(vm.name);
        tileCache.set(vm.name, t);
      }
      t.className = 'tile a-' + vm.alert + ' link-' + vm.link;
      const latest = vm.images[vm.images.length - 1];
      const src = latest ? (cfg.raw ? latest.raw : latest.annotated) : '';
      if (src && t._img.getAttribute('src') !== src) t._img.src = src;
      if (!src) { t._img.removeAttribute('src'); t._ph.style.display = ''; }
      t._lv.className = 'badge t-lv ' + (vm.alert === 'unknown' ? 'gray' : vm.alert);
      t._lv.textContent = ALERT_ICON[vm.alert] + ' ' + vm.alert.toUpperCase();
      t._age.textContent = fmtAge(vm.ageSec);
      t._sub.textContent = `${vm.meta.county}${vm.meta.district}` + (vm.link !== 'live' ? `・${LINK_TW[vm.link]}` : '') + (vm.reason ? `・${vm.reason}` : '');
      return t;
    }

    /* ==========================================================
       11. View modes, controls, keyboard
       ========================================================== */
    const mq = window.matchMedia('(max-width: 1100px)');
    function isMobile() { return mq.matches; }

    function setMobileTab(tab) {
      const app = $('#app');
      app.dataset.mtab = tab;
      document.querySelectorAll('.mtab').forEach(b => b.classList.toggle('active', b.dataset.mtab === tab));
      if (tab === 'map') setTimeout(() => map.updateSize(), 60);
      if (tab === 'detail') {
        const vm = S.selected && S.viewByName.get(S.selected);
        if (vm) setTimeout(() => drawChart(vm), 60);
      }
    }

    function syncLayout() {
      const mobile = isMobile();
      if (mobile) {
        // The video wall is a wide-screen affordance; there is nothing useful
        // to do with 63 tiles on a phone.
        if (!$('#wall-shell').classList.contains('hidden')) setMode('console');
        $('#app').dataset.mode = 'console';
        if (!$('#app').dataset.mtab) setMobileTab('queue');
      } else {
        $('#app').removeAttribute('data-mtab');
      }
      setTimeout(() => map && map.updateSize(), 60);
    }

    function setMode(mode) {
      const app = $('#app'), wall = $('#wall-shell');
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      if (mode === 'wall') {
        app.classList.add('hidden'); wall.classList.remove('hidden');
        renderWall();
      } else {
        wall.classList.add('hidden'); app.classList.remove('hidden');
        app.dataset.mode = mode;
        setTimeout(() => { map.updateSize(); const vm = S.selected && S.viewByName.get(S.selected); if (vm) drawChart(vm); }, 60);
      }
      cfg.mode = mode; saveCfg();
    }

    function syncControls() {
      document.querySelectorAll('#seg-zoom button').forEach(b => b.classList.toggle('active', b.dataset.v === cfg.zoom));
      document.querySelectorAll('#seg-theme button').forEach(b => b.classList.toggle('active', b.dataset.v === cfg.theme));
      document.querySelectorAll('#seg-base button').forEach(b => b.classList.toggle('active', b.dataset.v === cfg.base));
      document.querySelectorAll('#seg-tile button').forEach(b => b.classList.toggle('active', +b.dataset.v === +cfg.tile));
      $('#sw-raw').classList.toggle('on', cfg.raw);
      $('#sw-sound').classList.toggle('on', cfg.sound);
      $('#sw-notify').classList.toggle('on', cfg.notify);
      $('#in-stale').value = cfg.slowMult;
      $('#in-offline').value = cfg.deadMult;
      $('#in-poll').value = cfg.pollSec;
      $('#btn-sound').textContent = cfg.sound ? '🔔' : '🔕';
      $('#btn-sound').classList.toggle('on', cfg.sound);
      $('#btn-abnormal').classList.toggle('on', cfg.abnormalOnly);
      $('#w-abnormal').classList.toggle('on', cfg.abnormalOnly);
      $('#btn-labels').classList.toggle('on', S.showLabels);
      document.documentElement.dataset.zoom = cfg.zoom;
      document.documentElement.dataset.theme = cfg.theme;
      document.documentElement.style.setProperty('--tile', cfg.tile + 'rem');
    }

    function restartPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(poll, Math.max(2, cfg.pollSec) * 1000);
    }

    function exportCsv() {
      const head = ['camera', 'county', 'district', 'alert', 'link', 'timestamp', 'reason',
        ...LABELS.map(l => l + '_prop'), ...LABELS.map(l => l + '_conf')];
      const rows = S.view.map(v => [
        v.name, v.meta.county, v.meta.district, v.alert, LINK_TW[v.link],
        v.ts ? v.ts.toLocaleString('zh-TW', { hour12: false }) : '', v.reason,
        ...LABELS.map(l => (v.prop[l] || 0).toFixed(4)), ...LABELS.map(l => (v.conf[l] || 0).toFixed(4))
      ]);
      const csv = '﻿' + [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const a = el('a'); a.href = url;
      a.download = `debris_status_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '')}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function bindControls() {
      // View tabs
      $('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) setMode(b.dataset.mode); };

      // Mobile bottom tabs
      $('#mtabs').onclick = e => { const b = e.target.closest('.mtab'); if (b) setMobileTab(b.dataset.mtab); };
      mq.addEventListener('change', syncLayout);

      // KPI pills act as filters
      $('#kpis').onclick = e => {
        const b = e.target.closest('.kpi'); if (!b) return;
        const f = b.dataset.filter;
        S.kpiFilter = S.kpiFilter === f ? null : f;
        document.querySelectorAll('.kpi').forEach(k => k.setAttribute('aria-pressed', String(k.dataset.filter === S.kpiFilter)));
        renderQueue(); renderWall();
      };

      $('#q-search').addEventListener('input', debounce(renderQueue, 180));
      $('#w-search').addEventListener('input', debounce(renderWall, 180));
      $('#btn-abnormal').onclick = () => { cfg.abnormalOnly = !cfg.abnormalOnly; saveCfg(); syncControls(); renderQueue(); };
      $('#w-abnormal').onclick = () => { cfg.abnormalOnly = !cfg.abnormalOnly; saveCfg(); syncControls(); renderWall(); };

      // Map tools
      $('#btn-fit').onclick = fitAll;
      $('#btn-labels').onclick = () => {
        S.showLabels = !S.showLabels; cfg.labels = S.showLabels; saveCfg();
        styleCache.clear(); syncControls(); updateMap();
      };
      $('#btn-next-alert').onclick = jumpNextAlert;

      // Feed
      $('#btn-feed').onclick = () => {
        const f = $('#feed'); f.classList.toggle('collapsed');
        $('#btn-feed').textContent = f.classList.contains('collapsed') ? '▴' : '▾';
        setTimeout(() => map.updateSize(), 60);
      };
      $('#btn-clear-ev').onclick = () => {
        S.events = [];
        feedRendered = -1;
        const b = $('#feed-body');
        b.textContent = '';
        const e = el('div', 'empty'); e.style.padding = '1rem';
        e.append(el('span', 'big', '🕓'), document.createTextNode('事件已清除'));
        b.appendChild(e);
        $('#ev-count').textContent = '0';
      };

      // Detail playback
      $('#btn-play').onclick = () => { S.frame.playing = !S.frame.playing; syncPlayBtn(); };

      // Acknowledgement sheet
      $('#ack-x').onclick = closeAckSheet;
      $('#ack-cancel').onclick = closeAckSheet;
      $('#ack-ok').onclick = submitAck;
      $('#ack-back').onclick = e => { if (e.target === $('#ack-back')) closeAckSheet(); };

      // Header buttons
      $('#btn-sound').onclick = () => { cfg.sound = !cfg.sound; saveCfg(); syncControls(); if (cfg.sound) alarm('yellow'); };
      $('#btn-full').onclick = () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => { });
      };
      $('#btn-settings').onclick = e => { e.stopPropagation(); $('#settings').classList.toggle('hidden'); };
      document.addEventListener('click', e => {
        const p = $('#settings');
        if (!p.classList.contains('hidden') && !p.contains(e.target) && e.target !== $('#btn-settings')) p.classList.add('hidden');
      });

      // Settings
      $('#seg-zoom').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.zoom = b.dataset.v; saveCfg(); syncControls(); setTimeout(() => { map.updateSize(); const vm = S.selected && S.viewByName.get(S.selected); if (vm) drawChart(vm); }, 80); };
      $('#seg-theme').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.theme = b.dataset.v; saveCfg(); styleCache.clear(); syncControls(); updateMap(); const vm = S.selected && S.viewByName.get(S.selected); if (vm) drawChart(vm); };
      $('#seg-base').onclick = e => {
        const b = e.target.closest('button'); if (!b) return;
        cfg.base = b.dataset.v; saveCfg(); syncControls();
        baseLayer.setSource(new ol.source.XYZ({ url: BASEMAPS[cfg.base].url, attributions: BASEMAPS[cfg.base].attr }));
      };
      $('#seg-tile').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.tile = +b.dataset.v; saveCfg(); syncControls(); };
      $('#sw-raw').onclick = () => { cfg.raw = !cfg.raw; saveCfg(); syncControls(); renderAll(); };
      $('#sw-sound').onclick = () => { cfg.sound = !cfg.sound; saveCfg(); syncControls(); if (cfg.sound) alarm('yellow'); };
      $('#sw-notify').onclick = async () => {
        if (!cfg.notify && 'Notification' in window && Notification.permission !== 'granted') {
          const p = await Notification.requestPermission();
          if (p !== 'granted') { syncControls(); return; }
        }
        cfg.notify = !cfg.notify; saveCfg(); syncControls();
      };
      $('#in-stale').onchange = e => { cfg.slowMult = Math.max(2, +e.target.value || SLOW_MULT); saveCfg(); derive(); renderAll(); };
      $('#in-offline').onchange = e => { cfg.deadMult = Math.max(3, +e.target.value || DEAD_MULT); saveCfg(); derive(); renderAll(); };
      $('#in-poll').onchange = e => { cfg.pollSec = Math.max(2, +e.target.value || 5); saveCfg(); restartPolling(); };
      $('#btn-export').onclick = exportCsv;
      $('#btn-reset').onclick = () => {
        localStorage.removeItem(LS); localStorage.removeItem(LS + '.collapsed'); localStorage.removeItem(LS + '.operator');
        location.reload();
      };

      // Panel resizers
      document.querySelectorAll('.resizer').forEach(rz => {
        rz.addEventListener('mousedown', e => {
          e.preventDefault();
          const target = rz.dataset.target;
          rz.classList.add('drag');
          const move = ev => {
            const w = target === 'queue' ? ev.clientX : window.innerWidth - ev.clientX;
            const clamped = Math.max(220, Math.min(w, window.innerWidth * 0.4));
            document.documentElement.style.setProperty(target === 'queue' ? '--col-queue' : '--col-detail', clamped + 'px');
          };
          const up = () => {
            rz.classList.remove('drag');
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
            map.updateSize();
            const vm = S.selected && S.viewByName.get(S.selected); if (vm) drawChart(vm);
          };
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up);
        });
      });

      // Keyboard — a duty desk should not need the mouse.
      document.addEventListener('keydown', e => {
        if (e.target.matches('input, textarea')) {
          if (e.key === 'Escape') e.target.blur();
          return;
        }
        switch (e.key) {
          case '1': setMode('console'); break;
          case '2': setMode('wall'); break;
          case '3': setMode('map'); break;
          case '/': e.preventDefault(); $('#q-search').focus(); break;
          case 'j': moveSelection(1); break;
          case 'k': moveSelection(-1); break;
          case 'n': case 'N': jumpNextAlert(); break;
          case 'a': case 'A': { const b = $('#d-ack'); if (b) b.click(); break; }
          case 'm': case 'M': $('#btn-sound').click(); break;
          case 'f': case 'F': $('#btn-full').click(); break;
          case 'ArrowLeft': if (S.selected) { e.preventDefault(); stepFrame(-1); } break;
          case 'ArrowRight': if (S.selected) { e.preventDefault(); stepFrame(1); } break;
          case 'Escape': $('#settings').classList.add('hidden'); break;
        }
      });
    }

    function moveSelection(d) {
      const q = $('#q-search').value.trim().toLowerCase();
      const list = S.view.filter(v => passesFilter(v, q));
      if (!list.length) return;
      const i = list.findIndex(v => v.name === S.selected);
      const next = list[(((i < 0 ? 0 : i + d) % list.length) + list.length) % list.length];
      select(next.name);
      const row = rowCache.get(next.name);
      if (row) row.scrollIntoView({ block: 'nearest' });
    }

    let alertCursor = 0;
    function jumpNextAlert() {
      const alerts = S.view.filter(v => v.rank <= 2);
      if (!alerts.length) return;
      alertCursor = alertCursor % alerts.length;
      const vm = alerts[alertCursor++];
      select(vm.name);
      flyTo(vm.name, 13);
    }

    /* ==========================================================
       12. Boot
       ========================================================== */
    function tickClock() {
      $('#clock').textContent = fmtClock(new Date());
    }

    async function boot() {
      if (DEMO) showDemoBanner();
      syncControls();
      bindControls();
      syncPlayBtn();

      try {
        await loadCameras();
      } catch (e) {
        $('#queue').innerHTML = DEMO
          ? '<div class="empty"><span class="big">⚠</span>無法載入展示資料<br>demo/demo-data.json 讀取失敗</div>'
          : '<div class="empty"><span class="big">⚠</span>無法載入 cctv.json<br>請確認伺服器已啟動（python server.py）</div>';
        console.error(e);
        return;
      }

      initMap();
      await poll();
      restartPolling();

      setInterval(tickClock, 1000);
      tickClock();

      // Advance the detail-panel image loop independently of polling so the
      // playback speed does not change when the poll interval does.
      frameTimer = setInterval(() => {
        if (S.frame.playing && S.selected && S.frame.seq.length > 1 && $('#d-img')) showFrame(S.frame.idx + 1);
      }, 1400);

      // Ages are relative; refresh the "x 分前" labels between polls.
      setInterval(() => { derive(); renderQueue(); renderConn(); if (!$('#wall-shell').classList.contains('hidden')) renderWall(); }, 15000);

      window.addEventListener('resize', debounce(() => {
        syncLayout();     // matchMedia alone has missed this in some browsers
        map.updateSize();
        const vm = S.selected && S.viewByName.get(S.selected);
        if (vm) drawChart(vm);
      }, 150));

      syncLayout();
      if (!isMobile() && cfg.mode && cfg.mode !== 'console') setMode(cfg.mode);

      // Deep link: console.html?cam=<name>
      const want = new URLSearchParams(location.search).get('cam');
      if (want && S.byName.has(want)) select(want);
    }

    window.addEventListener('load', boot);
  </script>
</body>

</html>
