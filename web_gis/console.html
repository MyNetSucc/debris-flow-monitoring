<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark" data-zoom="md">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>土石流監測值班台 | Debris Flow Operations Console</title>
  <meta name="description" content="土石流即時監測值班監控台 — 警報優先、相機健康度、事件時間軸">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

  <style>
    /* ============================================================
       Design tokens
       Dark is the default: this board is meant to sit on a wall in a
       duty room. Light exists for daylight glare and is a pure token
       swap so nothing else in the sheet needs to know about it.
       ============================================================ */
    :root {
      --bg-0: #0b0e13;
      --bg-1: #121722;
      --bg-2: #1a2130;
      --bg-3: #232c3d;
      --bg-hover: #2a3547;
      --line: rgba(148, 163, 184, .16);
      --line-strong: rgba(148, 163, 184, .32);

      --fg-0: #f8fafc;
      --fg-1: #cbd5e1;
      --fg-2: #94a3b8;
      --fg-3: #64748b;

      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, .16);

      /* Alert semantics. Kept as the domain's red/yellow/green, but
         tuned for contrast on a dark ground and always paired with an
         icon + text so colour is never the only signal. */
      --red: #ff4d4f;
      --red-dim: rgba(255, 77, 79, .16);
      --red-glow: rgba(255, 77, 79, .45);
      --yellow: #fbbf24;
      --yellow-dim: rgba(251, 191, 36, .16);
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, .14);
      --gray: #7c8aa0;
      --gray-dim: rgba(124, 138, 160, .16);

      /* Detection classes */
      --c-clear: #38bdf8;
      --c-muddy: #fbbf24;
      --c-debris: #ff4d4f;
      --c-rock: #a78bfa;

      --radius: 10px;
      --radius-lg: 14px;
      --header-h: 4.2rem;
      --col-queue: 23rem;
      --col-detail: 27rem;
      --feed-h: 13rem;
      --tile: 15rem;
      --shadow: 0 12px 32px rgba(0, 0, 0, .45);
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    :root[data-theme="light"] {
      --bg-0: #eef1f6;
      --bg-1: #ffffff;
      --bg-2: #f4f6fa;
      --bg-3: #e6eaf1;
      --bg-hover: #dde3ec;
      --line: rgba(15, 23, 42, .12);
      --line-strong: rgba(15, 23, 42, .25);
      --fg-0: #0f172a;
      --fg-1: #334155;
      --fg-2: #64748b;
      --fg-3: #94a3b8;
      --accent: #0284c7;
      --accent-dim: rgba(2, 132, 199, .12);
      --red: #dc2626;
      --red-dim: rgba(220, 38, 38, .12);
      --red-glow: rgba(220, 38, 38, .35);
      --yellow: #b45309;
      --yellow-dim: rgba(180, 83, 9, .12);
      --green: #15803d;
      --green-dim: rgba(21, 128, 61, .12);
      --gray: #64748b;
      --gray-dim: rgba(100, 116, 139, .14);
      --c-clear: #0284c7;
      --c-muddy: #b45309;
      --c-debris: #dc2626;
      --c-rock: #7c3aed;
      --shadow: 0 12px 32px rgba(15, 23, 42, .15);
    }

    /* Wall-display scaling. Everything below is in rem, so one knob
       resizes the whole board for a projector or a 4K panel. */
    :root[data-zoom="md"] { font-size: 15px; }
    :root[data-zoom="lg"] { font-size: 17px; }
    :root[data-zoom="xl"] { font-size: 20px; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-0);
      color: var(--fg-0);
      font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
      overflow: hidden;
    }

    /* The page is one vertical stack: optional demo banner, header, the view,
       and on narrow screens the tab bar. Letting flexbox divide the height
       means no element has to know how tall any other one is — an earlier
       version measured the banner in JS and got it wrong the moment the text
       wrapped to a second line. */
    body { display: flex; flex-direction: column; }
    body > .app, body > .wall-shell { flex: 1 1 auto; min-height: 0; }

    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-3); }
    .hidden { display: none !important; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ============================================================
       Header
       ============================================================ */
    header.topbar {
      height: var(--header-h);
      /* Fixed chrome: without this it is a shrinkable flex item and gets
         squashed whenever the content below wants more room. */
      flex: 0 0 var(--header-h);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1rem;
      background: var(--bg-1);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 40;
    }

    .brand { display: flex; align-items: center; gap: .6rem; flex: 0 0 auto; }
    .brand-mark {
      width: 2.3rem; height: 2.3rem; display: grid; place-items: center;
      border-radius: var(--radius); background: linear-gradient(135deg, var(--accent), #6366f1);
      font-size: 1.2rem;
    }
    .brand-txt h1 { margin: 0; font-size: 1.02rem; font-weight: 800; letter-spacing: .01em; }
    .brand-txt p { margin: 0; font-size: .68rem; color: var(--fg-3); letter-spacing: .06em; text-transform: uppercase; }

    /* KPI pills double as filters — clicking one scopes the queue. */
    .kpis { display: flex; gap: .5rem; flex: 1 1 auto; min-width: 0; overflow: hidden; }
    .kpi {
      display: flex; align-items: center; gap: .55rem;
      padding: .4rem .8rem .4rem .6rem;
      background: var(--bg-2); border: 1px solid var(--line);
      border-radius: var(--radius); transition: .15s; white-space: nowrap;
    }
    .kpi:hover { background: var(--bg-hover); }
    .kpi[aria-pressed="true"] { border-color: currentColor; background: var(--bg-3); }
    .kpi .k-icon { font-size: .9rem; line-height: 1; }
    .kpi .k-num { font-size: 1.5rem; font-weight: 800; line-height: 1; font-family: var(--mono); }
    .kpi .k-lab { font-size: .7rem; color: var(--fg-2); line-height: 1.2; }
    .kpi .k-sub { font-size: .64rem; font-weight: 700; opacity: .85; }
    .kpi.red { color: var(--red); } .kpi.red .k-num { color: var(--red); }
    .kpi.yellow { color: var(--yellow); } .kpi.yellow .k-num { color: var(--yellow); }
    .kpi.gray { color: var(--gray); } .kpi.gray .k-num { color: var(--gray); }
    .kpi.green { color: var(--green); } .kpi.green .k-num { color: var(--green); }
    .kpi.red[data-hot="1"] { animation: kpiPulse 1.3s ease-in-out infinite; }
    @keyframes kpiPulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--red-glow); }
      50% { box-shadow: 0 0 0 .5rem rgba(255, 77, 79, 0); }
    }

    .head-right { display: flex; align-items: center; gap: .5rem; flex: 0 0 auto; }

    .clock { text-align: right; line-height: 1.25; }
    .clock .c-time { font-size: 1.15rem; font-weight: 700; font-family: var(--mono); }
    .clock .c-sub { font-size: .68rem; color: var(--fg-3); }

    .conn {
      display: flex; align-items: center; gap: .45rem;
      padding: .35rem .7rem; border-radius: 999px;
      background: var(--green-dim); color: var(--green);
      font-size: .74rem; font-weight: 600; white-space: nowrap;
    }
    .conn.bad { background: var(--red-dim); color: var(--red); }
    .conn .dot { width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; }
    .conn.ok .dot { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

    .tabs { display: flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: .2rem; }
    .tab {
      padding: .38rem .8rem; border: 0; background: transparent; color: var(--fg-2);
      border-radius: 7px; font-size: .8rem; font-weight: 600; transition: .15s;
    }
    .tab:hover { color: var(--fg-0); }
    .tab.active { background: var(--accent-dim); color: var(--accent); }

    .icon-btn {
      width: 2.2rem; height: 2.2rem; display: grid; place-items: center;
      background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
      color: var(--fg-1); font-size: 1rem; transition: .15s;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--fg-0); }
    .icon-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* ============================================================
       Settings popover
       ============================================================ */
    .popover {
      position: absolute; top: calc(var(--header-h) - .4rem); right: .8rem;
      width: 20rem; background: var(--bg-1); border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg); box-shadow: var(--shadow); z-index: 60; padding: .9rem;
    }
    .popover h3 { margin: 0 0 .7rem; font-size: .8rem; color: var(--fg-2); text-transform: uppercase; letter-spacing: .08em; }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .42rem 0; }
    .set-row label { font-size: .84rem; color: var(--fg-1); }
    .set-row .hint { display: block; font-size: .68rem; color: var(--fg-3); }
    .seg { display: flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { padding: .25rem .55rem; border: 0; background: transparent; color: var(--fg-2); font-size: .74rem; font-weight: 600; }
    .seg button.active { background: var(--accent-dim); color: var(--accent); }
    .num-in { width: 4.2rem; padding: .28rem .45rem; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; text-align: right; font-family: var(--mono); font-size: .8rem; }
    .switch { position: relative; width: 2.4rem; height: 1.3rem; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--line); transition: .18s; flex: 0 0 auto; }
    .switch::after { content: ''; position: absolute; top: 50%; left: .18rem; transform: translateY(-50%); width: .9rem; height: .9rem; border-radius: 50%; background: var(--fg-3); transition: .18s; }
    .switch.on { background: var(--accent-dim); border-color: var(--accent); }
    .switch.on::after { left: 1.28rem; background: var(--accent); }
    .pop-divider { height: 1px; background: var(--line); margin: .6rem 0; }
    .link-btn { background: none; border: 0; color: var(--accent); font-size: .78rem; padding: .2rem 0; text-align: left; }

    /* ============================================================
       App shell
       ============================================================ */
    .app {
      display: grid;
      grid-template-columns: var(--col-queue) minmax(0, 1fr) var(--col-detail);
    }
    .app[data-mode="map"] { --col-queue: 0rem; --col-detail: 0rem; }
    .app[data-mode="map"] .panel-queue,
    .app[data-mode="map"] .panel-detail { display: none; }

    .panel { background: var(--bg-1); display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    .panel-queue { border-right: 1px solid var(--line); }
    .panel-detail { border-left: 1px solid var(--line); }

    .resizer { position: absolute; top: 0; width: 6px; height: 100%; cursor: ew-resize; z-index: 20; }
    .resizer:hover, .resizer.drag { background: var(--accent-dim); }
    .resizer.r-right { right: -3px; }
    .resizer.r-left { left: -3px; }

    .panel-head {
      display: flex; align-items: center; gap: .5rem;
      padding: .7rem .85rem; border-bottom: 1px solid var(--line); flex: 0 0 auto;
    }
    .panel-head h2 { margin: 0; font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-2); }
    .panel-head .spacer { flex: 1; }
    .chip {
      padding: .2rem .5rem; border-radius: 999px; font-size: .68rem; font-weight: 700;
      background: var(--bg-3); color: var(--fg-2); font-family: var(--mono);
    }

    .search-wrap { padding: .6rem .7rem; border-bottom: 1px solid var(--line); display: flex; gap: .4rem; flex: 0 0 auto; }
    .search {
      flex: 1; padding: .5rem .7rem; background: var(--bg-2); border: 1px solid var(--line);
      border-radius: var(--radius); font-size: .84rem;
    }
    .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .search::placeholder { color: var(--fg-3); }
    .mini-btn {
      padding: .5rem .6rem; background: var(--bg-2); border: 1px solid var(--line);
      border-radius: var(--radius); font-size: .74rem; color: var(--fg-2); white-space: nowrap;
    }
    .mini-btn:hover { background: var(--bg-hover); color: var(--fg-0); }
    .mini-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* ============================================================
       Alert queue
       ============================================================ */
    .queue-list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: .5rem; }

    .sec-head {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem .55rem; margin: .5rem 0 .35rem;
      font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--fg-2); border-radius: 8px; background: var(--bg-2);
      position: sticky; top: -.5rem; z-index: 5;
    }
    .sec-head:first-child { margin-top: 0; }
    .sec-head .n { margin-left: auto; font-family: var(--mono); font-size: .8rem; color: var(--fg-1); }
    .sec-head.s-red { color: var(--red); background: var(--red-dim); }
    .sec-head.s-yellow { color: var(--yellow); background: var(--yellow-dim); }
    .sec-head.s-offline { color: var(--gray); background: var(--gray-dim); }
    .sec-head.s-green { color: var(--green); background: var(--green-dim); }
    .sec-head .caret { transition: transform .18s; }
    .sec-head.collapsed .caret { transform: rotate(-90deg); }

    .q-row {
      display: grid; grid-template-columns: 3px 4.6rem minmax(0, 1fr) auto;
      gap: .55rem; align-items: center;
      padding: .5rem .55rem .5rem .35rem; margin-bottom: .3rem;
      background: var(--bg-2); border: 1px solid transparent; border-radius: var(--radius);
      cursor: pointer; transition: background .12s, border-color .12s;
    }
    .q-row:hover { background: var(--bg-hover); }
    .q-row.sel { border-color: var(--accent); background: var(--accent-dim); }
    .q-bar { align-self: stretch; border-radius: 3px; background: var(--gray); }
    .q-row.a-red .q-bar { background: var(--red); }
    .q-row.a-yellow .q-bar { background: var(--yellow); }
    .q-row.a-green .q-bar { background: var(--green); }
    .q-row.a-red { box-shadow: inset 0 0 0 1px var(--red-dim); }

    .q-thumb {
      width: 4.6rem; height: 2.9rem; border-radius: 6px; overflow: hidden;
      background: var(--bg-3); position: relative; flex: 0 0 auto;
    }
    .q-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .q-thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: .9rem; color: var(--fg-3); }
    .q-main { min-width: 0; }
    .q-name { font-size: .87rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-meta { font-size: .7rem; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-reason { font-size: .72rem; color: var(--yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-row.a-red .q-reason { color: var(--red); }
    .q-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: .18rem; }
    .q-age { font-size: .68rem; color: var(--fg-3); font-family: var(--mono); }
    .q-age.stale { color: var(--yellow); }
    .q-age.offline { color: var(--red); }

    .badge {
      display: inline-flex; align-items: center; gap: .25rem;
      padding: .1rem .38rem; border-radius: 5px;
      font-size: .64rem; font-weight: 800; letter-spacing: .04em; font-family: var(--mono);
    }
    .badge.red { background: var(--red-dim); color: var(--red); }
    .badge.yellow { background: var(--yellow-dim); color: var(--yellow); }
    .badge.green { background: var(--green-dim); color: var(--green); }
    .badge.gray { background: var(--gray-dim); color: var(--gray); }
    .badge.ack { background: var(--bg-3); color: var(--fg-2); }

    .empty { padding: 2rem 1rem; text-align: center; color: var(--fg-3); font-size: .82rem; }
    .empty .big { font-size: 2rem; display: block; margin-bottom: .4rem; }

    /* ============================================================
       Center: map + event feed
       ============================================================ */
    .center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-0); }
    .map-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
    #map { position: absolute; inset: 0; background: var(--bg-0); }
    .ol-attribution { font-size: .62rem !important; }
    :root[data-theme="dark"] .ol-attribution { background: rgba(0, 0, 0, .5) !important; }
    :root[data-theme="dark"] .ol-attribution a { color: #94a3b8 !important; }

    .map-tools { position: absolute; top: .7rem; left: .7rem; display: flex; flex-direction: column; gap: .4rem; z-index: 10; }
    .map-tools .icon-btn { background: var(--bg-1); box-shadow: var(--shadow); }
    .map-legend {
      position: absolute; bottom: .7rem; left: .7rem; z-index: 10;
      background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius);
      padding: .55rem .7rem; box-shadow: var(--shadow); font-size: .72rem;
    }
    .map-legend .lg-title { font-size: .64rem; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); margin-bottom: .35rem; }
    .map-legend .lg-item { display: flex; align-items: center; gap: .45rem; padding: .12rem 0; color: var(--fg-1); }
    .lg-dot { width: .7rem; height: .7rem; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); }

    /* Pulsing halo overlay, attached only to cameras currently in red.
       Cheap because reds are few; an OL post-render animation for all
       63 points would burn frames for nothing. */
    .pulse { width: 2.6rem; height: 2.6rem; margin: -1.3rem 0 0 -1.3rem; border-radius: 50%; pointer-events: none; }
    .pulse::before, .pulse::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid var(--red); animation: ring 1.8s ease-out infinite;
    }
    .pulse::after { animation-delay: .9s; }
    @keyframes ring {
      0% { transform: scale(.35); opacity: .9; }
      100% { transform: scale(1); opacity: 0; }
    }

    .feed { height: var(--feed-h); border-top: 1px solid var(--line); background: var(--bg-1); display: flex; flex-direction: column; flex: 0 0 auto; }
    .feed.collapsed { height: 2.5rem; }
    .feed.collapsed .feed-body { display: none; }
    .feed-head { display: flex; align-items: center; gap: .5rem; padding: .45rem .8rem; border-bottom: 1px solid var(--line); }
    .feed-head h2 { margin: 0; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-2); }
    .feed-body { flex: 1; overflow-y: auto; padding: .25rem .5rem .5rem; }
    .ev {
      display: grid; grid-template-columns: 4.4rem auto minmax(0, 1fr) auto;
      gap: .6rem; align-items: baseline;
      padding: .3rem .5rem; border-radius: 7px; font-size: .78rem; cursor: pointer;
    }
    .ev:hover { background: var(--bg-2); }
    .ev .ev-t { font-family: var(--mono); font-size: .72rem; color: var(--fg-3); }
    .ev .ev-cam { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev .ev-msg { color: var(--fg-2); font-size: .74rem; }
    .ev.lv-red { background: linear-gradient(90deg, var(--red-dim), transparent 60%); }
    .ev.lv-yellow { background: linear-gradient(90deg, var(--yellow-dim), transparent 60%); }
    .arrow { font-family: var(--mono); font-weight: 700; }

    /* ============================================================
       Detail panel
       ============================================================ */
    .detail-body { flex: 1 1 auto; overflow-y: auto; }
    .d-head { padding: .8rem .85rem .6rem; border-bottom: 1px solid var(--line); }
    .d-name { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .d-name a { color: inherit; text-decoration: none; }
    .d-name a:hover { color: var(--accent); text-decoration: underline; }
    .d-loc { font-size: .74rem; color: var(--fg-3); margin-top: .15rem; }

    .d-status {
      display: flex; align-items: center; gap: .7rem;
      margin: .7rem .85rem; padding: .7rem .8rem; border-radius: var(--radius-lg);
      background: var(--bg-2); border-left: 4px solid var(--gray);
    }
    .d-status.a-red { background: var(--red-dim); border-color: var(--red); }
    .d-status.a-yellow { background: var(--yellow-dim); border-color: var(--yellow); }
    .d-status.a-green { background: var(--green-dim); border-color: var(--green); }
    .d-status .s-icon { font-size: 1.5rem; }
    .d-status .s-txt { flex: 1; min-width: 0; }
    .d-status .s-lv { font-size: 1rem; font-weight: 800; }
    .d-status.a-red .s-lv { color: var(--red); }
    .d-status.a-yellow .s-lv { color: var(--yellow); }
    .d-status.a-green .s-lv { color: var(--green); }
    .d-status .s-sub { font-size: .74rem; color: var(--fg-2); }

    .frame { position: relative; margin: 0 .85rem; border-radius: var(--radius); overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
    .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .frame .f-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); font-size: .82rem; background: var(--bg-3); }
    .frame .f-stamp {
      position: absolute; left: .5rem; bottom: .5rem;
      background: rgba(0, 0, 0, .7); color: #fff; padding: .18rem .45rem;
      border-radius: 5px; font-size: .68rem; font-family: var(--mono);
    }
    .frame .f-lv { position: absolute; right: .5rem; top: .5rem; }
    .frame .f-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 2rem; height: 2.6rem; border: 0; background: rgba(0, 0, 0, .5); color: #fff;
      font-size: 1.2rem; opacity: 0; transition: opacity .15s;
    }
    .frame:hover .f-nav { opacity: 1; }
    .frame .f-nav.prev { left: 0; border-radius: 0 6px 6px 0; }
    .frame .f-nav.next { right: 0; border-radius: 6px 0 0 6px; }

    .f-ctrl { display: flex; align-items: center; gap: .5rem; margin: .5rem .85rem 0; }
    .f-ctrl input[type=range] { flex: 1; accent-color: var(--accent); }
    .f-ctrl .cnt { font-family: var(--mono); font-size: .7rem; color: var(--fg-3); min-width: 3rem; text-align: right; }

    .sec { margin: 1rem .85rem 0; }
    .sec-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); margin-bottom: .5rem; display: flex; align-items: center; gap: .4rem; }
    .sec-title .spacer { flex: 1; }

    .bars { display: flex; flex-direction: column; gap: .5rem; }
    .bar-row { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr) 3.6rem; gap: .5rem; align-items: center; }
    .bar-lab { font-size: .76rem; color: var(--fg-1); display: flex; align-items: center; gap: .35rem; }
    .bar-lab .sw { width: .6rem; height: .6rem; border-radius: 2px; flex: 0 0 auto; }
    .bar-track { height: .55rem; background: var(--bg-3); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width .35s ease; }
    .bar-val { font-family: var(--mono); font-size: .72rem; text-align: right; color: var(--fg-1); }
    .bar-conf { font-size: .62rem; color: var(--fg-3); }

    .chart-box { position: relative; height: 8.5rem; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem; }
    .chart-box canvas { width: 100%; height: 100%; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
    .lg-chip {
      display: flex; align-items: center; gap: .3rem; padding: .16rem .45rem;
      border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line);
      font-size: .68rem; color: var(--fg-2);
    }
    .lg-chip.off { opacity: .38; }
    .lg-chip .sw { width: .55rem; height: .55rem; border-radius: 50%; }

    .kv { display: grid; grid-template-columns: auto 1fr; gap: .25rem .7rem; font-size: .76rem; }
    .kv dt { color: var(--fg-3); }
    .kv dd { margin: 0; color: var(--fg-1); font-family: var(--mono); font-size: .74rem; word-break: break-all; }

    .d-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem .85rem 1.2rem; }
    .act {
      flex: 1 1 auto; padding: .55rem .6rem; border-radius: var(--radius);
      background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-1);
      font-size: .78rem; font-weight: 600; transition: .15s; white-space: nowrap;
    }
    .act:hover { background: var(--bg-hover); color: var(--fg-0); }
    .act.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .act.danger { background: var(--red-dim); border-color: var(--red); color: var(--red); }

    /* ============================================================
       Wall view
       ============================================================ */
    .wall-shell { display: flex; flex-direction: column; background: var(--bg-0); }
    .wall-bar { display: flex; align-items: center; gap: .5rem; padding: .55rem .8rem; border-bottom: 1px solid var(--line); background: var(--bg-1); }
    .wall-grid {
      flex: 1; overflow-y: auto; padding: .7rem;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: .7rem; align-content: start;
    }
    .tile {
      background: var(--bg-2); border: 2px solid var(--line); border-radius: var(--radius);
      overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s;
    }
    .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
    .tile.a-red { border-color: var(--red); box-shadow: 0 0 0 1px var(--red-dim), 0 0 20px var(--red-dim); }
    .tile.a-yellow { border-color: var(--yellow); }
    .tile.a-green { border-color: var(--line); }
    .tile.link-offline { border-style: dashed; border-color: var(--gray); }
    .tile-img { position: relative; aspect-ratio: 4 / 3; background: #000; }
    .tile-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile-img .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); background: var(--bg-3); font-size: .78rem; }
    .tile-img .t-lv { position: absolute; top: .3rem; right: .3rem; }
    .tile-img .t-age { position: absolute; bottom: .3rem; right: .35rem; background: rgba(0, 0, 0, .65); color: #cbd5e1; padding: .08rem .3rem; border-radius: 4px; font-size: .62rem; font-family: var(--mono); }
    .tile-cap { padding: .4rem .5rem; }
    .tile-name { font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-sub { font-size: .66rem; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile.a-red .tile-name { color: var(--red); }

    /* ============================================================
       Toasts
       ============================================================ */
    .toasts { position: fixed; top: calc(var(--header-h) + .6rem); right: .9rem; z-index: 90; display: flex; flex-direction: column; gap: .5rem; width: 21rem; }
    .toast {
      background: var(--bg-1); border: 1px solid var(--red); border-left-width: 5px;
      border-radius: var(--radius); box-shadow: var(--shadow); padding: .7rem .8rem; cursor: pointer;
      animation: slideIn .25s ease-out;
    }
    .toast.lv-yellow { border-color: var(--yellow); }
    .toast .t-head { display: flex; align-items: center; gap: .4rem; font-size: .82rem; font-weight: 700; color: var(--red); }
    .toast.lv-yellow .t-head { color: var(--yellow); }
    .toast .t-body { font-size: .74rem; color: var(--fg-2); margin-top: .2rem; }
    @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }

    .banner {
      position: fixed; top: calc(var(--header-h) + .6rem); left: 50%; transform: translateX(-50%);
      z-index: 95; background: var(--red); color: #fff; padding: .5rem 1rem;
      border-radius: 999px; font-size: .82rem; font-weight: 700; box-shadow: var(--shadow);
    }

    /* ============================================================
       Acknowledgement sheet
       Bottom sheet on narrow screens, centred dialog on wide ones.
       ============================================================ */
    .sheet-back {
      position: fixed; inset: 0; z-index: 120;
      background: rgba(0, 0, 0, .55);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      width: min(30rem, 100%); max-height: 88vh; overflow-y: auto;
      background: var(--bg-1); border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 1rem; box-shadow: var(--shadow);
      animation: sheetUp .2s ease-out;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    @media (min-width: 700px) {
      .sheet-back { align-items: center; }
      .sheet { border-radius: var(--radius-lg); animation: none; }
    }
    .sheet-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    .sheet-head h3 { margin: 0; font-size: 1rem; flex: 1; }
    .sheet-cam { font-size: .84rem; color: var(--fg-1); margin-bottom: .6rem; }
    .sheet-cam .lv { font-weight: 700; }
    .sheet-note {
      font-size: .74rem; color: var(--fg-2); background: var(--bg-2);
      border-left: 3px solid var(--yellow); border-radius: 6px;
      padding: .5rem .6rem; margin-bottom: .7rem; line-height: 1.5;
    }
    .sheet-label { font-size: .72rem; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; margin: .7rem 0 .35rem; display: block; }
    .reasons { display: flex; flex-direction: column; gap: .3rem; }
    .reason {
      display: flex; align-items: center; gap: .55rem;
      padding: .55rem .6rem; border-radius: var(--radius);
      background: var(--bg-2); border: 1px solid var(--line);
      font-size: .82rem; text-align: left; color: var(--fg-1); width: 100%;
    }
    .reason:hover { background: var(--bg-hover); }
    .reason.sel { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
    .reason .rd { width: .85rem; height: .85rem; border-radius: 50%; border: 2px solid var(--fg-3); flex: 0 0 auto; }
    .reason.sel .rd { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 2px var(--bg-1); }
    #ack-text { width: 100%; margin-top: .4rem; resize: vertical; font-family: inherit; }
    .sheet-err { margin-top: .6rem; font-size: .78rem; color: var(--red); }
    .sheet-actions { display: flex; gap: .5rem; margin-top: 1rem; }
    .sheet-actions .act { flex: 1; }

    /* ============================================================
       Demo banner
       Permanent and not dismissible. A page that looks like live monitoring
       and names a river as having a debris flow can be screenshotted and
       forwarded; the label has to travel with it.
       ============================================================ */
    .demo-banner {
      flex: 0 0 auto; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      gap: .6rem; flex-wrap: wrap;
      padding: .4rem .8rem; text-align: center;
      background: repeating-linear-gradient(45deg, #b45309, #b45309 12px, #92400e 12px, #92400e 24px);
      color: #fff; font-size: .76rem; line-height: 1.35;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
    }
    .demo-banner strong { font-size: .84rem; letter-spacing: .04em; }
    .demo-banner span { opacity: .92; }
    @media (max-width: 1100px) {
      .demo-banner { font-size: .68rem; padding: .35rem .5rem; }
      .demo-banner strong { font-size: .74rem; }
    }

    /* ============================================================
       Bottom tab bar — the mobile navigation
       ============================================================ */
    .mtabs { display: none; }
    .mtab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: .1rem;
      padding: .45rem .2rem; border: 0; background: transparent; color: var(--fg-3);
      font-size: .68rem; font-weight: 600; position: relative; min-height: 3.2rem;
    }
    .mtab .mt-ico { font-size: 1.15rem; line-height: 1.1; }
    .mtab.active { color: var(--accent); }
    .mtab .mt-badge {
      position: absolute; top: .18rem; right: 50%; margin-right: -1.5rem;
      min-width: 1.15rem; padding: 0 .25rem; border-radius: 999px;
      background: var(--red); color: #fff; font-size: .62rem; line-height: 1.2rem;
      font-family: var(--mono); font-weight: 800;
    }
    .mtab .mt-badge.zero { display: none; }

    /* ============================================================
       Responsive
       Above 1100px this is a three-column board. Below it, the same page
       becomes one column with bottom tabs — the users reach it from phones
       as often as from a desk, so the narrow layout is a first-class
       arrangement of the same data, not a degraded fallback.
       ============================================================ */
    @media (max-width: 1400px) { :root { --col-detail: 23rem; --col-queue: 20rem; } }

    @media (max-width: 1100px) {
      :root { --header-h: 3.4rem; --feed-h: 11rem; }

      /* One column; the bottom tabs decide which panel occupies it. */
      .app { grid-template-columns: 1fr; }
      .app > .panel, .app > .center { display: none; }
      .app[data-mtab="queue"] > .panel-queue,
      .app[data-mtab="map"] > .center,
      .app[data-mtab="detail"] > .panel-detail { display: flex; }
      /* Fallback: if data-mtab was never set — a resize the media-query
         listener missed, or scripting that failed after layout — the alert
         list still shows. A blank screen is the one outcome a board like
         this must never produce. */
      .app:not([data-mtab]) > .panel-queue { display: flex; }
      .panel-queue, .panel-detail { border: 0; }
      .resizer { display: none; }

      .mtabs {
        display: flex; flex: 0 0 auto; z-index: 80;
        background: var(--bg-1); border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* The header keeps only what is readable at this width: the counts. */
      .brand-txt, .clock, .tabs, #btn-full { display: none; }
      .brand { margin-right: .2rem; }
      .brand-mark { width: 1.9rem; height: 1.9rem; font-size: 1rem; }
      .kpis { overflow-x: auto; scrollbar-width: none; }
      .kpis::-webkit-scrollbar { display: none; }
      .kpi { padding: .25rem .55rem .25rem .45rem; gap: .35rem; }
      .kpi .k-num { font-size: 1.15rem; }
      .kpi .k-lab { font-size: .6rem; }
      .conn { padding: .25rem .5rem; font-size: .66rem; }
      .conn span:not(.dot) { display: none; }

      /* Touch targets and legibility. */
      .q-row { grid-template-columns: 3px 5.2rem minmax(0, 1fr) auto; padding: .6rem .5rem .6rem .35rem; }
      .q-thumb { width: 5.2rem; height: 3.3rem; }
      .q-name { font-size: .92rem; }
      .act, .mini-btn, .search { min-height: 2.8rem; }
      .reason { min-height: 2.9rem; }
      .sec-head { padding: .6rem .55rem; }
      .feed { --feed-h: 9rem; }
      .map-legend { display: none; }
      .toasts { width: auto; left: .6rem; right: .6rem; top: calc(var(--header-h) + .4rem); }
      .banner { left: .6rem; right: .6rem; transform: none; text-align: center; font-size: .74rem; }
      .popover { left: .6rem; right: .6rem; width: auto; max-height: 76vh; overflow-y: auto; }
      .d-actions .act { flex: 1 1 45%; }
    }

    @media (max-width: 1100px) and (orientation: landscape) {
      /* A phone held sideways has almost no vertical room to spare. */
      :root { --header-h: 3rem; }
      .feed { display: none; }
    }
  </style>
</head>

<body>
  <!-- ===================== HEADER ===================== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🌊</div>
      <div class="brand-txt">
        <h1>土石流監測值班台</h1>
        <p>Debris Flow Ops Console</p>
      </div>
    </div>

    <div class="kpis" id="kpis">
      <button class="kpi red" data-filter="red" aria-pressed="false">
        <span class="k-icon">▲</span>
        <span><span class="k-num" id="kpi-red">0</span></span>
        <span class="k-lab">紅燈警報<br><span id="kpi-red-sub" class="k-sub hidden"></span></span>
      </button>
      <button class="kpi yellow" data-filter="yellow" aria-pressed="false">
        <span class="k-icon">◆</span>
        <span><span class="k-num" id="kpi-yellow">0</span></span>
        <span class="k-lab">黃燈<br>警示</span>
      </button>
      <button class="kpi gray" data-filter="offline" aria-pressed="false">
        <span class="k-icon">✕</span>
        <span><span class="k-num" id="kpi-offline">0</span></span>
        <span class="k-lab">停更<br>離線</span>
      </button>
      <button class="kpi green" data-filter="green" aria-pressed="false">
        <span class="k-icon">●</span>
        <span><span class="k-num" id="kpi-green">0</span></span>
        <span class="k-lab">正常<br>回報</span>
      </button>
    </div>

    <div class="head-right">
      <div class="conn ok" id="conn"><span class="dot"></span><span id="conn-txt">連線正常</span></div>
      <div class="clock">
        <div class="c-time" id="clock">--:--:--</div>
        <div class="c-sub" id="data-age">尚未取得資料</div>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-mode="console">監控台</button>
        <button class="tab" data-mode="wall">影像牆</button>
        <button class="tab" data-mode="map">全圖</button>
      </div>
      <button class="icon-btn" id="btn-sound" title="警報音效 (M)">🔕</button>
      <button class="icon-btn" id="btn-settings" title="設定">⚙</button>
      <button class="icon-btn" id="btn-full" title="全螢幕 (F)">⛶</button>
    </div>
  </header>

  <!-- ===================== SETTINGS ===================== -->
  <div class="popover hidden" id="settings">
    <h3>顯示</h3>
    <div class="set-row">
      <label>畫面比例<span class="hint">大螢幕請調大</span></label>
      <div class="seg" id="seg-zoom">
        <button data-v="md">中</button><button data-v="lg">大</button><button data-v="xl">特大</button>
      </div>
    </div>
    <div class="set-row">
      <label>佈景</label>
      <div class="seg" id="seg-theme">
        <button data-v="dark">深色</button><button data-v="light">亮色</button>
      </div>
    </div>
    <div class="set-row">
      <label>底圖</label>
      <div class="seg" id="seg-base">
        <button data-v="dark">深色</button><button data-v="street">街道</button><button data-v="sat">影像</button>
      </div>
    </div>
    <div class="set-row">
      <label>顯示原始影像<span class="hint">關閉時顯示 AI 標註結果</span></label>
      <button class="switch" id="sw-raw"></button>
    </div>

    <div class="pop-divider"></div>
    <h3>測站健康判定</h3>
    <div class="set-row">
      <label>回報變慢門檻<span class="hint">該站自身回報間隔的倍數</span></label>
      <div><input class="num-in" type="number" id="in-stale" min="2" step="1"> <span style="font-size:.72rem;color:var(--fg-3)">倍</span></div>
    </div>
    <div class="set-row">
      <label>無回報門檻<span class="hint">同上，超過即視為停止回報</span></label>
      <div><input class="num-in" type="number" id="in-offline" min="3" step="1"> <span style="font-size:.72rem;color:var(--fg-3)">倍</span></div>
    </div>
    <div class="set-row">
      <label>更新頻率</label>
      <div><input class="num-in" type="number" id="in-poll" min="2" step="1"> <span style="font-size:.72rem;color:var(--fg-3)">秒</span></div>
    </div>

    <div class="pop-divider"></div>
    <h3>提示</h3>
    <div class="set-row">
      <label>新警報音效</label>
      <button class="switch" id="sw-sound"></button>
    </div>
    <div class="set-row">
      <label>桌面通知<span class="hint">需瀏覽器授權</span></label>
      <button class="switch" id="sw-notify"></button>
    </div>

    <div class="pop-divider"></div>
    <button class="link-btn" id="btn-export">⬇ 匯出目前狀態 CSV</button><br>
    <button class="link-btn" id="btn-reset">↺ 重設所有設定</button>
  </div>

  <!-- ===================== CONSOLE ===================== -->
  <div class="app" id="app" data-mode="console">
    <!-- Alert queue -->
    <aside class="panel panel-queue">
      <div class="panel-head">
        <h2>警報佇列</h2>
        <span class="spacer"></span>
        <span class="chip" id="q-count">0</span>
      </div>
      <div class="search-wrap">
        <input class="search" id="q-search" type="text" placeholder="搜尋名稱 / 縣市 / 行政區　( / )">
        <button class="mini-btn on" id="btn-abnormal" title="只顯示需要注意的相機">異常優先</button>
      </div>
      <div class="queue-list" id="queue"></div>
      <div class="resizer r-right" data-target="queue"></div>
    </aside>

    <!-- Map + event feed -->
    <section class="center">
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-tools">
          <button class="icon-btn" id="btn-fit" title="回到全島">🗺</button>
          <button class="icon-btn" id="btn-next-alert" title="跳到下一個警報 (N)">⚑</button>
          <button class="icon-btn" id="btn-labels" title="顯示／隱藏站名">🏷</button>
        </div>
        <div class="map-legend">
          <div class="lg-title">圖例</div>
          <div class="lg-item"><span class="lg-dot" style="background:var(--red)"></span>紅燈：偵測到土石流</div>
          <div class="lg-item"><span class="lg-dot" style="background:var(--yellow)"></span>黃燈：濁流／異常徵兆</div>
          <div class="lg-item"><span class="lg-dot" style="background:var(--green)"></span>綠燈：正常</div>
          <div class="lg-item"><span class="lg-dot" style="background:var(--gray);border-style:dashed"></span>灰：停更／離線</div>
        </div>
      </div>

      <div class="feed" id="feed">
        <div class="feed-head">
          <h2>事件時間軸</h2>
          <span class="chip" id="ev-count">0</span>
          <span style="flex:1"></span>
          <button class="mini-btn" id="btn-clear-ev">清除</button>
          <button class="icon-btn" id="btn-feed" style="width:1.8rem;height:1.8rem;font-size:.8rem">▾</button>
        </div>
        <div class="feed-body" id="feed-body">
          <div class="empty" style="padding:1rem"><span class="big">🕓</span>本次連線尚未偵測到燈號變化</div>
        </div>
      </div>
    </section>

    <!-- Detail -->
    <aside class="panel panel-detail">
      <div class="resizer r-left" data-target="detail"></div>
      <div class="panel-head">
        <h2>單站詳情</h2>

      </div>
      <div class="detail-body" id="detail">
        <div class="empty" style="margin-top:4rem"><span class="big">👈</span>從左側佇列或地圖選擇一台攝影機</div>
      </div>

  </div>

  <!-- ===================== WALL ===================== -->
  <div class="wall-shell hidden" id="wall-shell">
    <div class="wall-bar">
      <input class="search" id="w-search" type="text" placeholder="搜尋攝影機…" style="max-width:22rem">
      <button class="mini-btn on" id="w-abnormal">異常優先</button>

  <!-- Mobile navigation. Lands on 警報 because the first question someone
       opens this on a phone to answer is "is anything wrong right now", not
       "where are the cameras". -->
  <nav class="mtabs" id="mtabs">
    <button class="mtab active" data-mtab="queue">
      <span class="mt-ico">⚠</span><span>警報</span><span class="mt-badge zero" id="mt-badge">0</span>
    </button>
    <button class="mtab" data-mtab="map"><span class="mt-ico">🗺</span><span>地圖</span></button>
    <button class="mtab" data-mtab="detail"><span class="mt-ico">📋</span><span>詳情</span></button>
  </nav>

  <div class="toasts" id="toasts"></div>

  <!-- Acknowledgement sheet. Deliberately a deliberate action: it writes a
       named, reasoned record that outlives the session. -->
  <div class="sheet-back hidden" id="ack-back">
    <div class="sheet" id="ack-sheet" role="dialog" aria-modal="true" aria-labelledby="ack-title">
      <div class="sheet-head">
        <h3 id="ack-title">確認警報</h3>
        <button class="icon-btn" id="ack-x" aria-label="關閉">✕</button>
